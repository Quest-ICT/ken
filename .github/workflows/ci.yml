name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The hygiene gate compares the newest CHANGELOG release against the tags,
          # so it needs them; the default checkout is shallow and tagless.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      # Ken is pure Go (its SQLite is a WASM build), so CGO stays off everywhere.
      - name: vet
        run: go vet ./...
        env: { CGO_ENABLED: "0" }

      - name: build
        run: go build ./...
        env: { CGO_ENABLED: "0" }

      - name: test
        run: go test ./...
        env: { CGO_ENABLED: "0" }

      # The race detector needs cgo, which is why it is a SEPARATE step rather than an
      # argument on the one above: the rest of the build is deliberately CGO_ENABLED=0.
      #
      # It earns its place. The smoke suite drives the built binary as a subprocess and
      # reads what it logged; the first version of that harness read the output buffer
      # while exec was still writing it. Every assertion over that log is NEGATIVE, so a
      # short read passed. `go test ./...` was green the whole time and shipped it.
      - name: test -race
        run: go test -race ./...
        env: { CGO_ENABLED: "1" }

      # Shell: the shared snapshot library carries security-critical logic (leak-safe
      # encryption, comment-safe recipient parsing) that Go tests don't reach.
      - name: snapshot-lib tests
        run: bash scripts/ken-snapshot-lib.test.sh

      - name: public hygiene gate
        run: sh scripts/check-public-hygiene.sh

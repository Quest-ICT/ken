name: Feature request
description: Suggest a capability or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Ken makes hard or impossible today?
    validations: { required: true }

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional — the problem matters more than a specific solution.

  - type: markdown
    attributes:
      value: |
        One thing worth knowing before proposing: **the AI authors, the human
        promotes.** An agent can never advance the curated head — that exclusion is
        the curation gate the whole design rests on, so proposals that let an agent
        self-curate are unlikely to be accepted. See [docs/DESIGN.md](../blob/main/docs/DESIGN.md).

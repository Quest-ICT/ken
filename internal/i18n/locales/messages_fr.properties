comm.repoint = Réaffecter
comm.repoint_help = Déplace ce point de terminaison vers un autre jeton. Il conserve son id, son secret, ses canaux, son lien de station et tout ce qui est en attente — seule la clé autorisée à le piloter change. La session doit pointer sa configuration MCP vers le nouveau jeton et redémarrer.
comm.repoint_confirm = Déplacer ce point de terminaison vers le jeton sélectionné ? Rien d'autre ne change — la session qui l'utilise sera refusée jusqu'à ce que sa configuration nomme le nouveau jeton et qu'elle redémarre.
flash.comm_repointed = Point de terminaison {0} réaffecté. Ses canaux, son lien et son courrier en attente sont inchangés ; la session a besoin du nouveau jeton dans sa configuration et d'un redémarrage.
flash.comm_repointed_bulk = {0} point(s) de terminaison réaffecté(s). Chaque session a besoin du nouveau jeton dans sa configuration et d'un redémarrage.
flash.comm_repoint_failed = Impossible de réaffecter ce point de terminaison : {0}
flash.comm_repoint_no_target = Choisissez le jeton vers lequel le déplacer.
flash.comm_repoint_bad_target = {0} ne peut pas posséder un point de terminaison comm — il doit exister, ne pas être révoqué et porter la portée comm. Rien n'a été modifié.
comm.repoint_all = Tout réaffecter
comm.repoint_all_help = Déplace en une fois tous les points de terminaison vivants de ce jeton vers un autre jeton. Chaque session conserve son id, son secret, ses canaux, son lien et son courrier en attente ; chacune a besoin du nouveau jeton dans sa configuration MCP et d'un redémarrage.
comm.repoint_all_confirm = Déplacer tous les points de terminaison vivants de ce jeton vers le jeton sélectionné ? Chacune de ces sessions sera refusée jusqu'à ce que sa configuration nomme le nouveau jeton et qu'elle redémarre.
comm.col_binder = Lié par
comm.col_station = Station
comm.col_live_endpoints = Points de terminaison vivants
comm.credentials_heading = Identifiants dont dépendent ces points de terminaison
comm.credentials_help = Un point de terminaison vivant répond à deux identifiants, et en révoquer l'un ou l'autre y met fin. Déplacez-les ici avant de révoquer quoi que ce soit — après coup, il n'y a pas de retour en arrière. Retirer une clé de station est différent : cela arrête la clé mais laisse tourner les sessions COMM qu'elle a liées.
comm.binders_help = Un point de terminaison lié porte aussi la clé de station qui a autorisé le lien. Cette clé est vérifiée à chaque appel : la révoquer ou la supprimer déconnecte la session même si son jeton reste intact. Un lien ne peut être déplacé que vers une autre clé de la même station.
comm.no_other_token = Aucun autre jeton comm
comm.no_other_key = Aucune autre clé pour cette station
comm.rebind = Relier
comm.rebind_help = Pointe le lien de ce point de terminaison vers une autre clé de la même station. Il conserve son id, son secret, ses canaux, sa station et tout ce qui est en attente — seule la clé pouvant le déconnecter change. Rien ne change pour la session en cours.
comm.rebind_confirm = Pointer le lien de ce point de terminaison vers la clé sélectionnée ? Rien ne change pour la session — c'est la clé qui pourrait la déconnecter qui change.
comm.rebind_all = Tout relier
comm.rebind_all_help = Pointe en une fois tous les points de terminaison vivants liés par cette clé vers une autre clé de la même station. Faites-le avant de révoquer la clé : la révoquer coupe ces points de terminaison et rien ne peut les rétablir. Retirer la clé ne les coupe pas.
comm.rebind_all_confirm = Pointer tous les points de terminaison liés par cette clé vers la clé sélectionnée ? Les sessions continuent de fonctionner ; seule la clé pouvant les déconnecter change.
flash.comm_rebound = Point de terminaison {0} relié. Son id, son secret, ses canaux, sa station et son courrier en attente sont inchangés ; la session n'a pas besoin de redémarrer.
flash.comm_rebound_bulk = {0} lien(s) de point de terminaison réaffecté(s). Les sessions continuent de fonctionner et n'ont pas besoin de redémarrer.
flash.comm_rebind_failed = Impossible de réaffecter ce lien : {0}
flash.comm_rebind_no_target = Choisissez la clé de station vers laquelle déplacer le lien.
flash.comm_rebind_bad_target = {0} n'a pas pu lier un point de terminaison — elle doit exister, ne pas être révoquée et être une clé de station. Rien n'a été changé.
flash.comm_rebind_nothing_moved = Rien n'a bougé. La clé choisie appartient à la station {0}, et un lien ne peut être déplacé que vers une clé de la même station — ou le point de terminaison avait déjà été déplacé, ou révoqué, ou balayé pendant que cette page était ouverte. Rien n'a été changé.
comm.col_created = Créé
comm.col_last_seen = Vu pour la dernière fois

settings.group.inter_session_comms = Communication entre sessions
#@src da3e06e647a2
settings.field.comm_max_body_bytes.label = Taille max de message (octets)
#@src 6e25bed50838
settings.field.comm_max_body_bytes.help = Les corps de message sont atomiques ; il n'y a pas d'envoi en plusieurs parties. Gardez cette valeur basse — les arguments d'outil sont générés token par token par un modèle, donc même 64 KiB représentent un nombre de tokens à cinq chiffres.
#@src 434104407757
settings.field.comm_max_unacked.label = Max non acquittés par canal
#@src 1ec26d285a73
settings.field.comm_max_unacked.help = Contre-pression. Au-delà, un envoi est refusé afin que deux sessions en traitement automatique ne bouclent pas indéfiniment.
#@src 01fc29e4f453
settings.field.comm_message_ttl_sec.label = Durée de vie après livraison (secondes)
#@src 9ca6a7b1cd06
settings.field.comm_message_ttl_sec.help = Combien de temps survit un message LIVRÉ mais non acquitté. Le compte à rebours démarre quand le destinataire reçoit le message pour la première fois, et non quand il a été envoyé — une session laisse passer 16 h entre deux interrogations un soir de semaine et 64 h pendant un week-end, si bien qu'un décompte ancré à l'envoi faisait expirer le courrier précisément pendant la fenêtre où personne ne pouvait le lire.
#@src 9fcbf0f94df4
settings.field.comm_undelivered_ttl_sec.label = Durée de vie avant livraison (secondes)
#@src 652346e8ec38
settings.field.comm_undelivered_ttl_sec.help = Garde-fou pour un message que PERSONNE n'a jamais relevé — il ne borne que le courrier adressé à une session qui ne revient jamais. Le courrier non livré est d'abord borné par le plafond de non-acquittés par canal, qui est une limite de volume et donc insensible à la durée d'absence d'un humain. Réglez cette valeur au-delà de la plus longue absence que vous prévoyez : comptez 400 h pour un congé de quinze jours.
#@src 8a3636b30082
settings.field.comm_body_retention_sec.label = Rétention du corps de message après règlement (secondes)
#@src 53f13e279db8
settings.field.comm_body_retention_sec.help = Combien de temps le TEXTE d'un message survit après son acquittement ou son expiration. ZÉRO rétablit l'ancien comportement, qui supprimait le corps à l'instant même de l'acquittement — ce qui a détruit 97 % des corps de messages d'un déploiement par le chemin ordinaire interroger/agir/acquitter, parce que la boîte de réception des non-acquittés était le seul endroit où un corps ait jamais existé.
#@src 92a9301fb57d
settings.field.comm_metadata_ttl_sec.label = Rétention des métadonnées (secondes)
#@src a0982dc933a9
settings.field.comm_metadata_ttl_sec.help = Combien de temps survit la ligne d'un message réglé, à compter de sa création. NOTE : puisque les corps survivent désormais à l'acquittement (voir « Rétention du corps de message »), ceci est aussi la SEULE borne sur un corps qui n'a jamais été livré — la rétention ne peut pas en purger un, car un message que personne n'a reçu n'a aucun instant de règlement à partir duquel mesurer. Augmenter cette valeur pour allonger la piste d'audit multiplie du même coup les octets non livrés conservés.
#@src 08fd1a7bdc94
settings.field.comm_reply_deadline_sec.label = Délai de réponse (secondes)
#@src 91d5f5ea50ed
settings.field.comm_reply_deadline_sec.help = Délai par défaut pour un message qui exige une réponse ; passé ce délai, l'expéditeur est informé que la réponse est en retard au lieu d'attendre indéfiniment.
#@src 6acf19a7d149
settings.field.comm_pairing_code_ttl_sec.label = Durée de vie du code d'appariement (secondes)
#@src 3c34b9ce9258
settings.field.comm_pairing_code_ttl_sec.help = Combien de temps un code que vous générez reste utilisable. Court, c'est bien : il n'a qu'à survivre au temps de le coller dans deux sessions.
#@src 852a1f7a1e58
settings.field.comm_poll_wait_max_sec.label = Attente max en interrogation longue (secondes)
#@src aa80b78fd96d
settings.field.comm_poll_wait_max_sec.help = Plafond de la durée pendant laquelle un appel de réception peut se bloquer. Ramené à 30 dans le code quoi qu'il arrive : une attente qui égale le délai d'expiration de l'outil côté client transforme une interrogation vide réussie en erreur.
#@src 1ee958e8488f
settings.field.comm_provenance_window_sec.label = Fenêtre de ouï-dire (secondes)
#@src fd98c5986fe8
settings.field.comm_provenance_window_sec.help = Si un token a reçu un message entre sessions aussi récemment, les entrées qu'il rédige sont signalées dans la file d'examen comme possiblement de seconde main. 0 désactive le signalement.
#@src c5f9dbaad6fe
settings.field.comm_files_enabled.label = Échange de fichiers activé
#@src bc620060fbaa
settings.field.comm_files_enabled.help = Permet aux sessions appariées d'échanger des fichiers (transfert sur le même hôte, ou relayé par Ken). Désactivé par défaut — le relais stocke des octets sur le disque de ce serveur.
#@src 2cf191d2901f
settings.field.comm_file_max_mb.label = Taille max de fichier (Mo)
#@src ec40dadd7447
settings.field.comm_file_max_mb.help = Plafond sur un fichier relayé ou proposé.
#@src 49f5d4afd53b
settings.field.comm_file_budget_mb.label = Budget de stockage du relais (Mo)
#@src 0ec17ebc4366
settings.field.comm_file_budget_mb.help = Plafond global sur les octets détenus à la fois dans le relais. Le relais partage le disque de ce serveur avec la base de connaissances ; le remplir ferait échouer les écritures durables à cause du trafic de discussion.
#@src 5fbbaf6373f1
settings.field.comm_file_min_free_mb.label = Plancher d'espace libre (Mo)
#@src c20acdc7d15d
settings.field.comm_file_min_free_mb.help = Les envois sont refusés quand le disque dispose de moins que cela, même sous le budget, afin que la base de connaissances ait toujours de la marge. 0 désactive le plancher.
#@src 071f3d4de393
settings.field.comm_file_ttl_sec.label = Durée de vie du fichier (secondes)
#@src 2881a8e66579
settings.field.comm_file_ttl_sec.help = Combien de temps un fichier proposé ou non livré survit avant d'expirer et que ses octets soient supprimés.
#@src 259bc922ea51
settings.field.comm_grant_ttl_sec.label = Durée de vie de l'autorisation de transfert (secondes)
#@src 4909a3b31075
settings.field.comm_grant_ttl_sec.help = Combien de temps une URL d'envoi/téléchargement à usage unique reste valide. Court, c'est juste : elle n'a qu'à survivre au temps d'être passée à curl.
#@src 241404d92614
settings.field.comm_endpoint_idle_sec.label = Nettoyage des sessions inactives (secondes)
#@src 9bb9974dbec6
settings.field.comm_endpoint_idle_sec.help = Combien de temps une session enregistrée sans trafic de messages survit avant d'être supprimée. Une session qui interroge activement rafraîchit sa dernière activité et n'est jamais supprimée ; ceci ne retire que les sessions qui se sont enregistrées puis sont parties. Gardez cette valeur confortablement supérieure aux intervalles d'inactivité d'une session au travail.
comm.stat_files = Fichiers en attente de livraison
comm.stat_file_bytes = Octets de relais sur le disque

# --- stations (docs/STATIONS.md §10) ---
# La console des identités de travail durables des IA. Affichée uniquement quand
# les stations sont activées ; sinon la page renvoie 404.
stations.tab = Stations
stations.eyebrow = Identités de travail durables
stations.heading = Stations
stations.lede = Une station est une identité de travail qu'une session IA occupe — elle possède un carnet, une liste de tâches et un casier, et elle survit à la session. C'est vous qui la nommez ; une session ne peut que la demander.

stations.tasks_showing = Affichage des {0} premières sur {1}. Affinez le filtre, ou clôturez-en.
stations.tasks_heading = En attente de vous, toutes stations confondues
stations.tasks_empty = Rien n'est en attente de vous pour l'instant.
stations.filter_human = Sur vous
stations.filter_human_help = Tâches qu'une session dit ne pas pouvoir terminer sans vous.
stations.filter_self = Sur la session
stations.filter_self_help = Tâches qu'une session porte elle-même — affichées pour que vous voyiez ce qu'elle estime avoir à sa charge.
stations.filter_peer = Sur un pair
stations.filter_peer_help = Tâches en attente d'une autre station.
stations.filter_any = Tout
stations.filter_any_help = Toutes les tâches ouvertes, peu importe qui elles attendent.
stations.col_task = Tâche
stations.col_station = Station
stations.col_blocked = En attente de
stations.col_created = Ouverte
stations.col_actions = Actions

settings.group.inter_session_comms = Communication entre sessions
#@src da3e06e647a2
settings.field.comm_max_body_bytes.label = Taille max de message (octets)
#@src 6e25bed50838
settings.field.comm_max_body_bytes.help = Les corps de message sont atomiques ; il n'y a pas d'envoi en plusieurs parties. Gardez cette valeur basse — les arguments d'outil sont générés token par token par un modèle, donc même 64 KiB représentent un nombre de tokens à cinq chiffres.
#@src 434104407757
settings.field.comm_max_unacked.label = Max non acquittés par canal
#@src 1ec26d285a73
settings.field.comm_max_unacked.help = Contre-pression. Au-delà, un envoi est refusé afin que deux sessions en traitement automatique ne bouclent pas indéfiniment.
#@src 01fc29e4f453
settings.field.comm_message_ttl_sec.label = Durée de vie après livraison (secondes)
#@src 9ca6a7b1cd06
settings.field.comm_message_ttl_sec.help = Combien de temps survit un message LIVRÉ mais non acquitté. Le compte à rebours démarre quand le destinataire reçoit le message pour la première fois, et non quand il a été envoyé — une session laisse passer 16 h entre deux interrogations un soir de semaine et 64 h pendant un week-end, si bien qu'un décompte ancré à l'envoi faisait expirer le courrier précisément pendant la fenêtre où personne ne pouvait le lire.
#@src 9fcbf0f94df4
settings.field.comm_undelivered_ttl_sec.label = Durée de vie avant livraison (secondes)
#@src 652346e8ec38
settings.field.comm_undelivered_ttl_sec.help = Garde-fou pour un message que PERSONNE n'a jamais relevé — il ne borne que le courrier adressé à une session qui ne revient jamais. Le courrier non livré est d'abord borné par le plafond de non-acquittés par canal, qui est une limite de volume et donc insensible à la durée d'absence d'un humain. Réglez cette valeur au-delà de la plus longue absence que vous prévoyez : comptez 400 h pour un congé de quinze jours.
#@src 8a3636b30082
settings.field.comm_body_retention_sec.label = Rétention du corps de message après règlement (secondes)
#@src 53f13e279db8
settings.field.comm_body_retention_sec.help = Combien de temps le TEXTE d'un message survit après son acquittement ou son expiration. ZÉRO rétablit l'ancien comportement, qui supprimait le corps à l'instant même de l'acquittement — ce qui a détruit 97 % des corps de messages d'un déploiement par le chemin ordinaire interroger/agir/acquitter, parce que la boîte de réception des non-acquittés était le seul endroit où un corps ait jamais existé.
#@src 92a9301fb57d
settings.field.comm_metadata_ttl_sec.label = Rétention des métadonnées (secondes)
#@src 49dd65cf5d22
settings.field.comm_metadata_ttl_sec.help = Combien de temps survit la ligne d'un message réglé, à compter du moment où il A ÉTÉ RÉGLÉ : l'accusé du dernier destinataire, ou l'expiration si personne ne l'a lu. (C'était compté depuis sa CRÉATION jusqu'à la 3.6.0, si bien qu'un message expirant au jour 30 avait déjà consommé sa rétention avant que quiconque ait pu le lire.) NOTE : comme les corps survivent à l'accusé, c'est aussi la SEULE borne pour un corps que personne n'a lu. L'augmenter pour un journal plus long multiplie aussi les octets conservés.
#@src 08fd1a7bdc94
settings.field.comm_reply_deadline_sec.label = Délai de réponse (secondes)
#@src 91d5f5ea50ed
settings.field.comm_reply_deadline_sec.help = Délai par défaut pour un message qui exige une réponse ; passé ce délai, l'expéditeur est informé que la réponse est en retard au lieu d'attendre indéfiniment.
#@src 6acf19a7d149
#@src 3c34b9ce9258
#@src 852a1f7a1e58
settings.field.comm_poll_wait_max_sec.label = Attente max en interrogation longue (secondes)
#@src aa80b78fd96d
settings.field.comm_poll_wait_max_sec.help = Plafond de la durée pendant laquelle un appel de réception peut se bloquer. Ramené à 30 dans le code quoi qu'il arrive : une attente qui égale le délai d'expiration de l'outil côté client transforme une interrogation vide réussie en erreur.
#@src 1ee958e8488f
settings.field.comm_provenance_window_sec.label = Fenêtre de ouï-dire (secondes)
#@src fd98c5986fe8
settings.field.comm_provenance_window_sec.help = Si un token a reçu un message entre sessions aussi récemment, les entrées qu'il rédige sont signalées dans la file d'examen comme possiblement de seconde main. 0 désactive le signalement.
#@src c5f9dbaad6fe
settings.field.comm_files_enabled.label = Échange de fichiers activé
#@src 305356469072
settings.field.comm_files_enabled.help = Permet aux sessions appariées d'échanger des fichiers (transfert sur le même hôte, ou relayé par Ken). ACTIVÉ par défaut, comme toute fonction de Ken. Désactivez-le pour que le relais cesse d'écrire des octets sur le disque de ce serveur — l'effet est immédiat, sans redémarrage, ce qui le rend utile en pleine incident.
#@src 2cf191d2901f
settings.field.comm_file_max_mb.label = Taille max de fichier (Mo)
#@src ec40dadd7447
settings.field.comm_file_max_mb.help = Plafond sur un fichier relayé ou proposé.
#@src 49f5d4afd53b
settings.field.comm_file_budget_mb.label = Budget de stockage du relais (Mo)
#@src 0ec17ebc4366
settings.field.comm_file_budget_mb.help = Plafond global sur les octets détenus à la fois dans le relais. Le relais partage le disque de ce serveur avec la base de connaissances ; le remplir ferait échouer les écritures durables à cause du trafic de discussion.
#@src 5fbbaf6373f1
settings.field.comm_file_min_free_mb.label = Plancher d'espace libre (Mo)
#@src c20acdc7d15d
settings.field.comm_file_min_free_mb.help = Les envois sont refusés quand le disque dispose de moins que cela, même sous le budget, afin que la base de connaissances ait toujours de la marge. 0 désactive le plancher.
#@src 071f3d4de393
settings.field.comm_file_ttl_sec.label = Durée de vie du fichier (secondes)
#@src 2881a8e66579
settings.field.comm_file_ttl_sec.help = Combien de temps un fichier proposé ou non livré survit avant d'expirer et que ses octets soient supprimés.
#@src 259bc922ea51
settings.field.comm_grant_ttl_sec.label = Durée de vie de l'autorisation de transfert (secondes)
#@src 4909a3b31075
settings.field.comm_grant_ttl_sec.help = Combien de temps une URL d'envoi/téléchargement à usage unique reste valide. Court, c'est juste : elle n'a qu'à survivre au temps d'être passée à curl.
#@src 241404d92614
#@src 9bb9974dbec6
comm.stat_files = Fichiers en attente de livraison
comm.stat_file_bytes = Octets de relais sur le disque

# --- stations (docs/STATIONS.md §10) ---
# La console des identités de travail durables des IA. Affichée uniquement quand
# les stations sont activées ; sinon la page renvoie 404.
stations.tab = Stations
stations.eyebrow = Identités de travail durables
stations.heading = Stations
stations.lede = Une station est une identité de travail qu'une session IA occupe — elle possède un carnet, une liste de tâches et un casier, et elle survit à la session. C'est vous qui la nommez ; une session ne peut que la demander.

stations.tasks_showing = Affichage des {0} premières sur {1}. Affinez le filtre, ou clôturez-en.
stations.tasks_heading = En attente de vous, toutes stations confondues
stations.tasks_empty = Rien n'est en attente de vous pour l'instant.
stations.filter_human = Sur vous
stations.filter_human_help = Tâches qu'une session dit ne pas pouvoir terminer sans vous.
stations.filter_self = Sur la session
stations.filter_self_help = Tâches qu'une session porte elle-même — affichées pour que vous voyiez ce qu'elle estime avoir à sa charge.
stations.filter_peer = Sur un pair
stations.filter_peer_help = Tâches en attente d'une autre station.
stations.filter_any = Tout
stations.filter_any_help = Toutes les tâches ouvertes, peu importe qui elles attendent.
stations.col_task = Tâche
stations.col_station = Station
stations.col_blocked = En attente de
stations.col_created = Ouverte
stations.col_actions = Actions
# blocked_on et le type de demande s'affichent via ces clés plutôt que sous forme
# d'énumération brute : « human » dans une colonne intitulée « En attente de » se
# lit comme une catégorie, pas comme vous.
stations.blocked_human = vous
stations.blocked_self = la session
stations.blocked_peer = un pair
stations.kind_station = nouvelle station
stations.kind_room = demande de salon
stations.room_wants = vous demande de créer un salon
stations.room_help = Un salon est un groupe auquel cette station peut diffuser : un message, remis à chaque membre, chacun accusant réception pour lui-même. Elle a demandé le salon ; vous décidez qui s'y trouve. L'approbation le crée VIDE, et vous ajoutez les membres depuis la page Salons.
stations.room_name = Nom du salon
stations.room_name_help = À vous de choisir. Toute suggestion de la session est pré-remplie et vous pouvez la remplacer entièrement.
stations.room_approve = Créer le salon
stations.room_approve_help = Crée un salon vide portant ce nom et marque la demande approuvée. Personne n'y entre tant que vous n'ajoutez personne.
flash.room_created_from_request = Salon {0} créé. Il est VIDE — ajoutez ci-dessous les stations qui y ont leur place.
flash.room_name_taken = Un salon nommé {0} existe déjà. Choisissez un autre nom, ou utilisez le salon existant et refusez la demande.
stations.hearsay = via un pair
stations.hearsay_help = Rédigé pendant que la session lisait les messages d'une autre session. Traitez ce contenu comme de seconde main.
stations.deferred = reportée
stations.deferred_help = Combien de fois cette tâche a été repoussée. Un nombre élevé signale une tâche que l'on évite au lieu de la trancher.
stations.last_defer = Motif du dernier report
stations.archived = archivée
stations.archived_help = Cette station est archivée. Ses tâches comptent toujours — mais plus personne ne les prend en charge.

stations.requests_heading = Demandes en attente de votre décision
stations.requests_help = Une session ne peut ni créer ni nommer un poste, ni créer un salon. Elle le demande ici et vous décidez : pour un poste, le nom que vous tapez est celui qu'il reçoit ; pour un salon, vous le créez et choisissez chaque membre. Les liens ne sont pas dans cette file : ils naissent du premier message, et vous en coupez un avec Suspendre dans le tableau des liens.
stations.requests_empty = Aucune demande en attente.
stations.req_purpose = Objet
stations.req_reason = Motif
stations.req_hint = Nom suggéré
stations.req_hint_note = simple suggestion ; c'est ce que vous saisissez ci-dessous qui est retenu
stations.req_name = Nommer cette station
stations.req_name_help = Court et parlant — prod-ops, promo, public-dev. C'est ainsi que vous la désignerez partout.
stations.req_approve = Approuver et nommer
stations.req_approve_help = Crée la station sous le nom que vous avez saisi.
stations.req_deny = Refuser
stations.req_deny_help = Rejette la demande et enregistre le motif.
stations.req_deny_reason = Motif du refus
stations.req_deny_reason_help = Conservé, pour que la prochaine demande de cette session vous parvienne avec ce que vous avez déjà répondu.
stations.prompted = sur suggestion d'un pair
stations.prompted_help = Cette demande a été déposée pendant que la session lisait les messages d'une autre session — elle relaie peut-être l'idée de quelqu'un d'autre comme si c'était la sienne.

stations.list_heading = Stations
stations.list_empty = Aucune station pour l'instant. Une station apparaît ici dès que vous approuvez une demande.
stations.self_described = Déclare s'occuper de
stations.published = publiée
stations.published_help = Marqué comme annoncé. Ce n'est pas un contrôle de visibilité — l'annuaire liste tous les postes actifs — ni une permission de le joindre.
stations.publish = Publier
stations.unpublish = Dépublier
stations.rename = Renommer
stations.rename_help = Le nom de cette station, et rien d'autre. Rien ne s'adresse à une station par son nom : la renommer ne casse aucun lien, canal ni message — partout où l'ancien nom apparaissait, le nouveau s'affiche aussitôt.
stations.rename_do = Enregistrer le nom
stations.publish_help = Marque ce poste comme annoncé. Cela ne contrôle PAS qui le voit : l'annuaire liste tous les postes actifs, car il y a un seul humain ici et personne à qui cacher quoi que ce soit. La joignabilité est inchangée dans les deux cas.
stations.archive = Archiver
stations.unarchive = Désarchiver
stations.vault = Coffre
stations.vault_help = Identifiants détenus par cette station. Les valeurs ne sont jamais listées — en révéler une est une action distincte et elle est journalisée.
stations.vault_lede = Secrets qu'une session a déposés ici. Ils sont CHIFFRÉS AU REPOS en AES-256-GCM sous une clé conservée hors de la base et hors de toute sauvegarde (data/vault.key) — une sauvegarde seule ne les révèle donc pas, et ne les restaure pas non plus si vous n'avez pas mis cette clé de côté. Chaque lecture est enregistrée et rien n'est détruit : une réécriture ou une suppression reste récupérable.
stations.vault_name = Nom
stations.vault_note = De quoi il s'agit
stations.vault_bytes = Taille
stations.vault_reads = Lectures
stations.vault_updated = Mis à jour
stations.vault_deleted = supprimé
stations.vault_deleted_help = Une session a retiré ce secret. Il n'est plus lisible, et sa valeur peut encore être restaurée.
stations.vault_reveal = Révéler
stations.vault_reveal_help = Affiche la valeur une fois, sur l'écran suivant. Cela est enregistré dans le journal ci-dessous exactement comme la lecture d'une session.
stations.vault_restore = Restaurer la précédente
stations.vault_restore_help = Rétablit la valeur que ce nom avait avant la dernière écriture. À utiliser quand une session a écrasé ou supprimé la mauvaise chose.
stations.vault_trail = Lectures
stations.vault_trail_bounded = affichage des plus récentes
stations.vault_trail_actor_unknown = acteur non enregistré
stations.vault_revealed = Secret révélé
stations.vault_revealed_help = Affiché une seule fois. Recharger cette page le perd, et le récupérer est une nouvelle lecture enregistrée.
stations.vault_revealed_logged = Cette révélation figure désormais dans le journal de lectures de la station, marquée comme provenant de la console.
stations.archive_help = Réversible. Arrête COMM — aucun courrier n'est plus adressé ici et aucune session ne peut agir comme ce poste — et les liens deviennent dormants. Le carnet, les tâches, le casier et le coffre restent intacts et reviennent avec lui. Désarchiver rétablit les liens rendus dormants par l'archivage, pas ceux que vous avez suspendus.
stations.last_activity = Dernière activité
stations.usage_notes = Notes
stations.usage_tasks = Tâches ouvertes/total
stations.usage_locker = Casier


stations.transfer = Déplacer le travail de cette station ailleurs
stations.transfer_help = Confie le carnet, les tâches et le casier à une autre station — quand une session a disparu, ou qu'une machine est remplacée.
stations.transfer_note = Un déplacement, pas une copie. L'opération est refusée d'emblée si un nom de page ou de fichier existe des deux côtés, afin que rien ne soit écrasé en silence — une page de passation entre presque toujours en collision, et les noms concernés vous seront indiqués.
stations.transfer_to = Déplacer vers
stations.transfer_to_help = La station qui possédera ces éléments ensuite.
stations.transfer_notes = pages du carnet (avec leur historique)
stations.transfer_tasks = tâches
stations.transfer_locker = fichiers du casier
stations.reassign = Réaffecter à une conversation
stations.held = occupé
stations.held_help = Une conversation possède ce poste et y revient après un redémarrage. Si cette conversation a disparu, réaffectez le poste pour en récupérer le contenu.
stations.unclaimed = libre
stations.unclaimed_help = Aucune conversation ne possède encore ce poste ; la prochaine session qui déclare une clé peut l'adopter.
stations.reassign_help = Confie ce poste à une session — le seul retour possible dans un poste dont la conversation a disparu.
stations.reassign_note = Demandez à la session sa clé de conversation (une session Claude Code a un UUID ; une session de chat en invente une et l'annonce dans sa réponse), collez-la ici, et son prochain appel à station_me arrivera dans ce poste. La clé désigne un poste ; elle n'accorde rien, ce n'est donc pas un secret. Laissez le champ vide pour libérer ce poste.
stations.reassign_key = Clé de conversation
stations.reassign_key_placeholder = collez la clé donnée par la session
stations.reassign_key_help = La chaîne stable par laquelle cette session s'identifie. Vide libère le poste.
stations.reassign_submit = Réaffecter
stations.reassign_submit_help = Prend effet au prochain appel de la session ; rien ici ne touche au contenu du poste.
stations.transfer_vault = secrets du coffre (le transfert est journalisé)
stations.transfer_submit = Déplacer
stations.transfer_submit_help = Applique d'un coup toutes les catégories sélectionnées, ou rien du tout.


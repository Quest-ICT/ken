comm.credentials_help = Les boîtes aux lettres appartiennent aux POSTES, non aux sessions ni aux crédentiels. Il n'y a rien à déplacer ni à faire tourner ici : la boîte d'un poste est créée à la première utilisation et réutilisée par chaque session qui l'occupe. Pour arrêter une session, archivez son poste sur la page Postes, ou retirez son autorisation OAuth sur la page Jetons.

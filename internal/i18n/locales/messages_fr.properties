flash.station_vault_restore_failed = Impossible de restaurer ce secret : {0}
flash.station_vault_restored_pruned = {0} restauré. Cette restauration a poussé la plus ancienne valeur récupérable hors de la limite de rétention : elle est perdue — une restauration est elle-même une écriture.
flash.station_vault_restored = Valeur précédente de {0} restaurée.
flash.station_link_revoke_failed = Impossible de révoquer le lien : {0}
flash.station_link_revoked_channels_failed = Le lien {0} a été révoqué, mais ses canaux actifs n'ont pas pu être fermés. Fermez-les depuis la console Comm.
flash.station_link_revoked_comm_off = Lien terminé : {0}. COMM est désactivé sur ce serveur, ses canaux n'ont donc pas pu être vérifiés ni fermés — ils sont peut-être encore ouverts. Revérifiez depuis la console Comm une fois COMM activé.

# Rotation du secret d'un endpoint. Accessible uniquement depuis cette console
# authentifiée — jamais depuis un outil — car un token couvre une machine entière :
# ce qu'une session pourrait déclencher, n'importe quelle session le pourrait.
comm.rotate = Renouveler le secret
comm.rotate_help = Émet un nouveau secret pour cet endpoint. Il garde son id et tous ses canaux : les pairs ne sont pas affectés et rien n'est à réapparier.
comm.rotate_confirm = Renouveler le secret de cet endpoint ? L'ancien cesse de fonctionner immédiatement, et la session qui l'utilise ne pourra ni envoyer ni recevoir tant que vous ne lui aurez pas donné le nouveau.
comm.rotated = renouvelé
comm.rotated_help = Le secret de cet endpoint a été remplacé au moins une fois.
comm.rotated_heading = Nouveau secret de l'endpoint
comm.rotated_help_body = Donnez les deux valeurs à la session propriétaire de cet endpoint. Ses canaux restent intacts — elle peut reprendre où elle en était. Dites-lui de les écrire dans un fichier sur disque, plutôt que de compter sur sa mémoire.
comm.rotated_warn = C'est la seule fois où le secret est affiché. Seul son hachage est conservé, et l'ancien secret ne fonctionne plus.
flash.comm_rotate_failed = Impossible de renouveler le secret : {0}

# Les boîtes de confirmation nomment CE QU'elles affectent. Les libellés des endpoints
# sont choisis par l'agent et finissent par se ressembler ; les canaux, eux, parlent.
comm.confirm_endpoint = Session
comm.confirm_channels = Ses canaux
comm.revoke_bound_endpoint_confirm = Révoquer le point de terminaison de cette session ? Irréversible : la session qui détient ce secret est coupée à son prochain appel. La STATION conserve ses canaux : une session de remplacement se lie avec un bon et en hérite, sans nouvel appairage. Si le secret a seulement fuité ou été perdu, utilisez ROTATION — la session continue de fonctionner.
comm.confirm_station_keeps = Canaux que cette station conserve
comm.confirm_will_close = Canaux qui seront fermés
comm.rotated_dont_leave = Ne quittez pas cette page avant d'avoir collé cette valeur dans la session. L'ancien secret est déjà inutilisable.
comm.copy = Copier
comm.copy_help = Copie le secret dans le presse-papiers.
comm.copied = Copié
comm.saved_it = Je l'ai enregistré
comm.saved_it_help = Masque le secret et cesse de vous avertir en quittant la page.

stations.link_wants = veut parler à
stations.link_grants = Approuver permet à ces deux stations d'échanger des messages privés, et ouvre cette conversation immédiatement si les deux sont occupées. Cela ne met NI l'une NI l'autre dans un salon et n'élargit la portée de diffusion de personne.
stations.link_help = Approuver permet à ces deux stations d'ouvrir des canaux entre elles quand elles en ont besoin, sans que vous génériez un code à chaque fois. Un clic suffit pour révoquer ensuite.
stations.link_approve = Approuver ce lien
stations.link_approve_help = Crée une relation permanente entre les deux stations.
stations.link_revoke = Révoquer
stations.link_revoke_help = Met fin à la relation et ferme tout canal qu'elle autorisait.
stations.link_revoke_confirm_unknown = Révoquer le lien entre {0} et {1} ? Le nombre de canaux actifs que cela fermera est INCONNU — COMM est désactivé ou le comptage n'a pas pu être lu, il n'a donc jamais été mesuré. Les deux stations conservent leurs carnets, tâches et historique ; seuls le droit de communiquer et le trafic qu'il porte encore prennent fin.
stations.link_revoke_confirm = Révoquer le lien entre {0} et {1} ? {2} canal(aux) actif(s) seront fermés. Les deux stations conservent leurs carnets, tâches et historique — seuls le droit de communiquer et son trafic actuel prennent fin.
flash.link_approved_open = Lien approuvé : {0} — et leur conversation privée est ouverte, utilisable sans code d'appairage.
flash.link_approved = Lien approuvé : {0}

stations.key_id = Id de la clé
stations.key_actor = Acteur
stations.key_actor_nocomm = aucun jeton COMM
stations.key_actor_nocomm_help = Cette cle a ete emise sous un acteur qui ne detient aucun jeton COMM. La cle fonctionne pour tous les outils de station, mais elle ne peut pas lier un point de terminaison : la liaison exige que le jeton COMM du point de terminaison et cette cle appartiennent au meme acteur. Emettez une cle sous l'acteur qui detient le jeton COMM de cette machine.
stations.key_created = Créée
stations.key_unmeasured = non mesuré
stations.key_not_audited = Enregistrée depuis la 1.5.3, limitée à environ une fois par minute. Un blanc signifie que cette clé ne s'est pas authentifiée depuis, et non que l'utilisation n'est pas enregistrée. Vérifiez-le avant de retirer une clé : c'est le seul signal indiquant si quelque chose la détient encore.

stations.promotions_heading = Pages qu'un poste souhaite promouvoir en connaissance
stations.promotions_lede = Une session vous a demande de convertir une de ses pages de carnet en entree de la base de connaissance. Lisez-la ici, puis enregistrez-la vous-meme si elle le merite : cette page n'ecrit jamais de connaissance.
stations.promotions_hearsay = peut-etre de seconde main
stations.promotions_hearsay_help = Cette page a ete ecrite pendant que son poste recevait des messages d'une autre session ; une partie peut ne pas etre de premiere main. Demandez une source avant de promouvoir.
stations.promotions_moved = la page a change depuis
stations.promotions_moved_help = La page a ete modifiee apres cette demande : le texte ci-dessous n'est pas celui que la session vous a demande d'examiner.
stations.promotions_slug_placeholder = slug de l'entree, si vous en avez enregistre une
stations.promotions_slug_help = Facultatif. Noter en quelle entree la page s'est transformee laisse une trace de la note vers la connaissance.
stations.promotions_converted = Marquer convertie
stations.promotions_converted_help = Clot la demande. Enregistrez l'entree vous-meme d'abord : ce bouton enregistre votre decision, il n'ecrit pas de connaissance.
stations.promotions_discard = Ecarter
stations.promotions_discard_help = Clot la demande sans convertir. La page du carnet reste intacte.
flash.promotion_converted = Marquee convertie.
flash.promotion_discarded = Demande ecartee.
flash.promotion_already_decided = Cette demande etait deja tranchee.
flash.promotion_failed = Impossible de resoudre la demande

# --- added 2026-08-24: keys that existed only in the base locale ---
#@src c661eb38af14
settings.field.comm_claim_lease_sec.label = Réservation de station (secondes)
#@src 46d5d7e754a7
settings.field.comm_claim_lease_sec.help = Quand plusieurs sessions tiennent une même station, la première à relever un message se le réserve et les autres ne le voient pas. Voici combien de temps dure cette réservation avant que le message redevienne disponible.
#@src 0e0cd4996fd0
settings.field.station_locker_blob_kib.label = Taille de fichier du casier (KiB)
#@src 6750ae49ca41
settings.field.station_locker_blob_kib.help = Le plus gros fichier qu'une station peut stocker. Le casier sert à la mémoire et aux fichiers d'instructions, pas aux charges utiles.
#@src 8ce7a57dfbf2
settings.field.station_locker_total_kib.label = Casier par station (KiB)
#@src 9c20fea87261
settings.field.station_locker_total_kib.help = Stockage total du casier qu'une station peut utiliser. Tout ce qui s'y trouve part tel quel dans vos sauvegardes, et Ken ne peut pas l'inspecter.
#@src 193910078133
settings.field.station_max_open_tasks.label = Tâches ouvertes par station
#@src 3d23f0ab45f3
settings.field.station_max_open_tasks.help = Combien de tâches une station peut avoir ouvertes en même temps. Une liste plus longue que cela n'est pas traitée, et refuser est plus honnête que de la laisser grossir.
#@src 8ccd7656160f
settings.field.station_note_page_kib.label = Taille de page du carnet (KiB)
#@src 7d4db0bc76e1
settings.field.station_note_page_kib.help = La taille maximale d'une page de carnet. Une page plus grande que cela est un document et non une note, et les pages voyagent dans chaque sauvegarde.
#@src 542a1970a99a
settings.field.station_note_revision_kib.label = Historique de révisions par page (KiB)
#@src 2e32b52e1d94
settings.field.station_note_revision_kib.help = Combien d'historique d'édition une page conserve avant que les plus anciennes révisions soient supprimées. C'est un tampon d'annulation, pas une archive : il existe pour qu'une session puisse revenir sur sa propre erreur.
#@src 0aed5c2460b4
settings.field.station_notebook_kib.label = Carnet par station (KiB)
#@src fe7ab9cf3fb2
settings.field.station_notebook_kib.help = Taille totale des pages actuelles du carnet d'une station, hors historique. Environ soixante pages complètes à la taille de page par défaut.
#@src 9bfa0b341657
settings.field.station_task_detail_bytes.label = Taille du détail de tâche (octets)
#@src f6de043d2041
settings.field.station_task_detail_bytes.help = Le détail et le contexte facultatifs joints à une tâche. Une tâche qui a besoin de plus est en réalité une page de carnet accompagnée d'un plan.
#@src 0e9596731c48
settings.field.station_task_list_limit.label = Taille de page de la liste des tâches
#@src e789dded42ee
settings.field.station_task_list_limit.help = Le nombre par défaut ET maximal de tâches que renvoie une liste. Il borne la part de la pile qu'une session peut charger d'un coup dans son contexte.
#@src 80085d0c6cb1
settings.field.station_task_text_bytes.label = Longueur de ligne de tâche (octets)
#@src b206db922b71
settings.field.station_task_text_bytes.help = Le résumé d'une ligne d'une tâche et sa ligne de résolution. Courts par construction : ce qui demande plus a sa place dans le champ détail ou dans une page de carnet.
#@src 792ea76a97eb
settings.field.station_vault_entries.label = Secrets par station
#@src 19c325d5e26d
settings.field.station_vault_entries.help = Combien d'identifiants une station peut détenir. Tout ce qui s'y trouve est stocké NON CHIFFRÉ et voyage dans chaque sauvegarde — la protection, c'est la machine et la sauvegarde, pas Ken.
#@src 05fdb06a4b3d
settings.field.station_vault_history_rev.label = Versions du coffre conservées par secret
#@src 3ed6de63cf7c
settings.field.station_vault_history_rev.help = Combien de valeurs remplacées restent récupérables après un écrasement ou une suppression. C'est ce qui rend une écriture au coffre réversible ; à 0, un écrasement est définitif.
#@src bde3a7f2c14e
settings.field.station_vault_read_log.label = Lectures du coffre conservées par station
#@src 0874749942dd
settings.field.station_vault_read_log.help = Combien d'enregistrements de lecture la piste d'audit conserve. Le NOMBRE de lectures par secret reste exact de toute façon, donc abaisser ceci raccourcit la piste sans masquer la fréquence des lectures.
#@src 612cbe30af67
settings.field.station_vault_secret_kib.label = Taille de secret du coffre (KiB)
#@src 8b5d5ec05ee1
settings.field.station_vault_secret_kib.help = Le plus gros identifiant qu'une station peut stocker. Une clé privée PEM tient ; au-delà c'est un fichier, et les fichiers vont au casier.
rooms.heading = Salles
rooms.lede = Une salle permet à plusieurs stations de discuter à la fois : un message atteint chaque membre, et chacun répond pour lui-même. Les sessions ne peuvent pas créer de salles — c'est vous qui décidez qui en fait partie. Une station ajoutée aujourd'hui ne voit rien de ce qui a été envoyé avant son arrivée.
rooms.members = membres
rooms.deaf = ne peut pas recevoir
rooms.deaf_help = Un ou plusieurs membres n'ont aucune session liée : ils sont dans cette salle sur le papier et ne reçoivent rien de ce qui y est envoyé.
rooms.deaf_lede = Certains membres ne peuvent pas encore recevoir. Ajouter une station à une salle est correct et permanent — mais une station n'entend qu'une fois qu'une de ses sessions a lié un point de terminaison. Demandez à cette session d'appeler station_binding_voucher puis comm_bind ; rien de ce qui est envoyé entre-temps n'est perdu, cela attend jusqu'à 30 jours.
rooms.member_deaf = non liée
rooms.member_deaf_help = Aucune session n'est liée à cette station : elle ne reçoit rien de ce qui est envoyé à cette salle. Son appartenance est correcte et permanente ; c'est la session qui doit se lier. Le courrier déjà envoyé l'attend.
rooms.member = Station
rooms.added = Ajoutée
rooms.add = Ajouter à la salle
rooms.add_help = La station rejoint la salle à partir de maintenant. Elle ne verra rien de ce que la salle a dit avant aujourd'hui.
rooms.remove = Retirer
rooms.remove_help = Retire la station de la salle. Les messages déjà envoyés restent dans sa boîte — l'audience a été fixée à l'envoi de chacun.
rooms.archive = Archiver
rooms.unarchive = Rouvrir
rooms.archive_help = Empêche immédiatement la salle d'accepter de nouveaux messages. Son historique conserve son adresse, et la rouvrir la restaure.
rooms.archived = archivée
rooms.archived_help = Cette salle n'accepte aucun nouveau message. Rien n'a été supprimé.
rooms.create = Créer une salle
rooms.create_help = Crée la salle vide. Ajoutez-y des stations ensuite.
rooms.new_name = Nom de la salle
rooms.new_name_help = La façon dont les sessions y feront référence. Court et précis vaut mieux que descriptif.
rooms.new_purpose = À quoi elle sert
rooms.new_purpose_help = Facultatif. Affiché ici pour vous ; il n'est pas transmis aux sessions.
flash.room_created = Salle {0} créée. Ajoutez-y des stations.
flash.room_name_required = Saisissez un nom pour la salle.
flash.room_create_failed = Impossible de créer cette salle : {0}
flash.room_member_failed = Impossible de modifier cette appartenance : {0}
flash.room_membership_saved = Appartenance à la salle mise à jour.
flash.room_archive_failed = Impossible d'archiver cette salle : {0}
flash.room_archived = Salle mise à jour.
proposals.via_comm_broadcast = entendu dans une salle ?
proposals.via_comm_directed_hint = Pendant la rédaction, une autre session avait envoyé un message DIRECTEMENT à l'identité qui l'a écrit. Ce n'est pas la preuve que l'entrée provient du message — la vérification ne voit pas le contenu — mais c'est le plus fort des deux signaux. Demandez une source avant de promouvoir.
proposals.via_comm_broadcast_hint = Pendant la rédaction, l'identité qui l'a écrit était l'un de plusieurs destinataires d'un message de salle. Plus faible qu'un message dirigé : être dans une salle où quelque chose a été dit est courant, et une diffusion marque tous les membres d'un coup.
#@src 63bc242b2011
settings.field.rl_enabled.help = Active ou désactive entièrement la protection contre les abus — limites par IP et par jeton, blocage automatique, tout. Désactivée, chaque requête atteint l'application.
#@src ccd3ee6b8319
settings.field.rl_token_burst.help = Taille du seau pour un jeton d'agent — absorbe une session qui enchaîne plusieurs appels dans un même tour sans les compter contre son débit soutenu.
#@src 1d544e294962
settings.field.rl_lockout_sec.help = Combien de temps une IP bloquée automatiquement le reste. Le blocage est un 403 renvoyé avant que la requête n'entre dans la chaîne : refuser un appelant bloqué ne coûte rien.
#@src aedb9a4ff35e
settings.field.login_lockout_sec.help = Combien de temps une IP est refusée après trop d'échecs de connexion. S'applique par realm : être bloqué sur une console ne vous bloque pas sur une autre.

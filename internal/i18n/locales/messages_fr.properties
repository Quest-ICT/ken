flash.station_link_revoked_comm_off = Lien suspendu : {0}. La base de messages n'est pas ouverte sur ce serveur ; ses canaux n'ont pu être ni vérifiés ni fermés — ils sont peut-être encore actifs.
flash.station_link_resumed = Lien rétabli : {0}. Les deux postes peuvent de nouveau s'adresser l'un à l'autre ; les canaux fermés par la suspension ne sont pas restaurés, car les sessions qui les tenaient ont disparu.

# Rotation du secret d'un endpoint. Accessible uniquement depuis cette console
# authentifiée — jamais depuis un outil — car un token couvre une machine entière :
# ce qu'une session pourrait déclencher, n'importe quelle session le pourrait.

# Les boîtes de confirmation nomment CE QU'elles affectent. Les libellés des endpoints
# sont choisis par l'agent et finissent par se ressembler ; les canaux, eux, parlent.

stations.link_suspend = Suspendre
stations.link_suspend_help = Désactive cette relation. Les canaux actifs se ferment ; le lien reste listé et vous pouvez le reprendre à tout moment.
stations.link_suspend_confirm = Suspendre le lien entre {0} et {1} ? Cela ferme {2} canal(aux) actif(s). Le lien reste listé et Reprendre le réactive — les canaux ne reviennent pas, car les sessions qui les tenaient ont disparu.
stations.link_suspend_confirm_unknown = Suspendre le lien entre {0} et {1} ? Ken ne peut pas compter les canaux actifs pour l'instant ; supposez qu'il y en a. Le lien reste listé et Reprendre le réactive.
stations.link_resume = Reprendre
stations.link_resume_help = Réactive cette relation. Les stations peuvent de nouveau s'adresser l'une à l'autre ; les anciens canaux ne sont pas restaurés.


stations.promotions_heading = Pages qu'un poste souhaite promouvoir en connaissance
stations.promotions_lede = Une session vous a demande de convertir une de ses pages de carnet en entree de la base de connaissance. Lisez-la ici, puis enregistrez-la vous-meme si elle le merite : cette page n'ecrit jamais de connaissance.
stations.promotions_hearsay = peut-etre de seconde main
stations.promotions_hearsay_help = Cette page a ete ecrite pendant que son poste recevait des messages d'une autre session ; une partie peut ne pas etre de premiere main. Demandez une source avant de promouvoir.
stations.promotions_moved = la page a change depuis
stations.promotions_moved_help = La page a ete modifiee apres cette demande : le texte ci-dessous n'est pas celui que la session vous a demande d'examiner.
stations.promotions_slug_placeholder = slug de l'entree, si vous en avez enregistre une
stations.promotions_slug_help = Facultatif. Noter en quelle entree la page s'est transformee laisse une trace de la note vers la connaissance.
stations.promotions_converted = Marquer convertie
stations.promotions_converted_help = Clot la demande. Enregistrez l'entree vous-meme d'abord : ce bouton enregistre votre decision, il n'ecrit pas de connaissance.
stations.promotions_discard = Ecarter
stations.promotions_discard_help = Clot la demande sans convertir. La page du carnet reste intacte.
stations.id = Identifiant du poste
stations.id_help = L'identifiant que les sessions utilisent pour s'adresser à ce poste : comm_directory le fournit et comm_send{to_station} l'emploie. Les noms sont pour vous ; c'est ceci qui apparaît dans le compte rendu d'une session.
flash.promotion_converted = Marquee convertie.
flash.promotion_discarded = Demande ecartee.
flash.promotion_already_decided = Cette demande etait deja tranchee.
flash.promotion_failed = Impossible de resoudre la demande


comm.revoke_endpoint_confirm = Révoquer l'endpoint de cette session ? C'est irréversible : chaque pair devra se réapparier avec un nouveau code pour la joindre. Si le secret a seulement fuité ou été perdu, RENOUVELEZ-le plutôt — les canaux sont conservés.

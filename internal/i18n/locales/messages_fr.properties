stations.kind_link = nouveau lien
stations.hearsay = via un pair
stations.hearsay_help = Rédigé pendant que la session lisait les messages d'une autre session. Traitez ce contenu comme de seconde main.
stations.deferred = reportée
stations.deferred_help = Combien de fois cette tâche a été repoussée. Un nombre élevé signale une tâche que l'on évite au lieu de la trancher.
stations.last_defer = Motif du dernier report
stations.archived = archivée
stations.archived_help = Cette station est archivée. Ses tâches comptent toujours — mais plus personne ne les prend en charge.

stations.requests_heading = Demandes en attente de votre décision
stations.requests_help = Une session ne peut ni créer ni nommer une station. Elle en fait la demande ici, et vous décidez — le nom que vous saisissez est celui qu'elle portera.
stations.requests_empty = Aucune demande en attente.
stations.req_purpose = Objet
stations.req_reason = Motif
stations.req_hint = Nom suggéré
stations.req_hint_note = simple suggestion ; c'est ce que vous saisissez ci-dessous qui est retenu
stations.req_name = Nommer cette station
stations.req_name_help = Court et parlant — prod-ops, promo, public-dev. C'est ainsi que vous la désignerez partout.
stations.req_approve = Approuver et nommer
stations.req_approve_help = Crée la station sous le nom que vous avez saisi.
stations.req_deny = Refuser
stations.req_deny_help = Rejette la demande et enregistre le motif.
stations.req_deny_reason = Motif du refus
stations.req_deny_reason_help = Conservé, pour que la prochaine demande de cette session vous parvienne avec ce que vous avez déjà répondu.
stations.prompted = sur suggestion d'un pair
stations.prompted_help = Cette demande a été déposée pendant que la session lisait les messages d'une autre session — elle relaie peut-être l'idée de quelqu'un d'autre comme si c'était la sienne.

stations.list_heading = Stations
stations.list_empty = Aucune station pour l'instant. Une station apparaît ici dès que vous approuvez une demande.
stations.self_described = Déclare s'occuper de
stations.published = publiée
stations.published_help = Figure dans l'annuaire des stations que les autres sessions peuvent lire. Ce n'est pas l'autorisation de la joindre.
stations.publish = Publier
stations.unpublish = Dépublier
stations.rename = Renommer
stations.rename_help = Le nom de cette station, et rien d'autre. Rien ne s'adresse à une station par son nom : la renommer ne casse aucun lien, canal ni message — partout où l'ancien nom apparaissait, le nouveau s'affiche aussitôt.
stations.rename_do = Enregistrer le nom
stations.publish_help = Inscrit cette station à l'annuaire ou l'en retire. Sans effet sur la possibilité de la joindre.
stations.archive = Archiver
stations.unarchive = Désarchiver
stations.vault = Coffre
stations.vault_help = Identifiants détenus par cette station. Les valeurs ne sont jamais listées — en révéler une est une action distincte et elle est journalisée.
stations.vault_lede = Secrets qu'une session a déposés ici. Ils sont conservés NON CHIFFRÉS : quiconque peut lire cette machine ou une sauvegarde peut les lire, donc la protection est l'hôte et la sauvegarde, pas Ken. Chaque lecture ci-dessous est enregistrée, et rien ici n'est détruit — un écrasement ou une suppression reste récupérable.
stations.vault_name = Nom
stations.vault_note = De quoi il s'agit
stations.vault_bytes = Taille
stations.vault_reads = Lectures
stations.vault_updated = Mis à jour
stations.vault_deleted = supprimé
stations.vault_deleted_help = Une session a retiré ce secret. Il n'est plus lisible, et sa valeur peut encore être restaurée.
stations.vault_reveal = Révéler
stations.vault_reveal_help = Affiche la valeur une fois, sur l'écran suivant. Cela est enregistré dans le journal ci-dessous exactement comme la lecture d'une session.
stations.vault_restore = Restaurer la précédente
stations.vault_restore_help = Rétablit la valeur que ce nom avait avant la dernière écriture. À utiliser quand une session a écrasé ou supprimé la mauvaise chose.
stations.vault_trail = Lectures
stations.vault_trail_bounded = affichage des plus récentes
stations.vault_trail_actor_unknown = acteur non enregistré
stations.vault_revealed = Secret révélé
stations.vault_revealed_help = Affiché une seule fois. Recharger cette page le perd, et le récupérer est une nouvelle lecture enregistrée.
stations.vault_revealed_logged = Cette révélation figure désormais dans le journal de lectures de la station, marquée comme provenant de la console.
stations.archive_help = Réversible. Arrête COMM — aucun nouveau courrier n'est adressé ici et aucune session ne peut agir en tant que cette station — et les liens deviennent dormants. Les clés continuent de fonctionner : le carnet, les tâches, le casier et le coffre restent accessibles, et le nom est conservé. Pour arrêter aussi une clé, retirez-la ou révoquez-la.
stations.last_activity = Dernière activité
stations.usage_notes = Notes
stations.usage_tasks = Tâches ouvertes/total
stations.usage_locker = Casier
stations.usage_keys = Clés actives

stations.key_label = Clé
stations.key_last_used = Dernière utilisation
stations.key_state = État
stations.key_live = active
stations.key_retired = retirée
stations.key_revoked = révoquée
stations.key_retire = Retirer
stations.key_retire_help = Cesse immédiatement de fonctionner, y compris pour les sessions qui la détiennent : elles perdent le carnet, les tâches, le casier et le coffre dès leur prochain appel. Les points de terminaison COMM déjà liés continuent de fonctionner. N'utilisez Révoquer que si vous voulez aussi les couper.
stations.key_new_label = Nouvelle clé pour
stations.key_new_label_help = Nommez la machine, pas la personne — c'est une clé par machine qui donne un sens à la révocation de l'une d'elles.
stations.key_mint = Émettre la clé
stations.key_mint_help = Crée une clé pour cette station. Affichée une seule fois.
stations.key_new = Votre nouvelle clé de station
stations.key_new_help = À placer dans la configuration du client MCP de la session, en en-tête Authorization. Ne la collez jamais dans un prompt ni dans un argument d'outil.
stations.key_new_warn = C'est la seule fois où elle est affichée. Seule son empreinte est stockée.

stations.transfer = Déplacer le travail de cette station ailleurs
stations.transfer_help = Confie le carnet, les tâches et le casier à une autre station — quand une session a disparu, ou qu'une machine est remplacée.
stations.transfer_note = Un déplacement, pas une copie. L'opération est refusée d'emblée si un nom de page ou de fichier existe des deux côtés, afin que rien ne soit écrasé en silence — une page de passation entre presque toujours en collision, et les noms concernés vous seront indiqués.
stations.transfer_to = Déplacer vers
stations.transfer_to_help = La station qui possédera ces éléments ensuite.
stations.transfer_notes = pages du carnet (avec leur historique)
stations.transfer_tasks = tâches
stations.transfer_locker = fichiers du casier
stations.transfer_submit = Déplacer
stations.transfer_submit_help = Applique d'un coup toutes les catégories sélectionnées, ou rien du tout.


stations.key_actor = Actor
stations.key_actor_nocomm = sin token COMM
stations.key_actor_nocomm_help = Esta clave se emitio bajo un actor que no posee ningun token COMM. La clave funciona para todas las herramientas de estacion, pero no puede vincular un extremo: la vinculacion exige que el token COMM del extremo y esta clave pertenezcan al mismo actor. Emita una clave bajo el actor que posee el token COMM de esta maquina.
stations.key_created = Creada
stations.key_unmeasured = sin medir
stations.key_not_audited = El uso de las claves de puesto NO se registra — este campo nunca se rellena. Un blanco significa sin medir, no sin usar; no hay forma de saber cuál de dos claves está en uso.


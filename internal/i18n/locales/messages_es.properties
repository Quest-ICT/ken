settings.group.inter_session_comms = Comunicación entre sesiones
#@src da3e06e647a2
settings.field.comm_max_body_bytes.label = Tamaño máximo de mensaje (bytes)
#@src 6e25bed50838
settings.field.comm_max_body_bytes.help = Los cuerpos de los mensajes son atómicos; no hay envío por partes. Mantenlo pequeño: los argumentos de las herramientas los genera un modelo token a token, así que incluso 64 KiB son decenas de miles de tokens.
#@src 434104407757
settings.field.comm_max_unacked.label = Máximo sin confirmar por canal
#@src 1ec26d285a73
settings.field.comm_max_unacked.help = Control de saturación. A partir de aquí se rechaza el envío para que dos sesiones que procesan automáticamente no entren en un bucle sin fin.
#@src 01fc29e4f453
settings.field.comm_message_ttl_sec.label = Vida tras la entrega (segundos)
#@src 9ca6a7b1cd06
settings.field.comm_message_ttl_sec.help = Cuánto sobrevive un mensaje ya ENTREGADO pero sin confirmar. El reloj empieza a contar cuando el mensaje se le entrega por primera vez al destinatario, no cuando se envió — una sesión tarda 16 h en volver a sondear una noche entre semana, y 64 h durante un fin de semana, así que un reloj anclado al envío hacía caducar los mensajes justo en la ventana en la que nadie podía leerlos.
#@src 9fcbf0f94df4
settings.field.comm_undelivered_ttl_sec.label = Vida antes de la entrega (segundos)
#@src 652346e8ec38
settings.field.comm_undelivered_ttl_sec.help = Red de seguridad para un mensaje que NADIE ha recogido nunca — solo pone límite a los mensajes dirigidos a un endpoint que ya no vuelve. A los mensajes sin entregar los limita antes que nada el máximo sin confirmar por canal, que es un límite de volumen y, por tanto, es indiferente al tiempo que una persona esté ausente. Ponlo por encima de la ausencia más larga que esperes: dos semanas de vacaciones son 400 h.
#@src 8a3636b30082
settings.field.comm_body_retention_sec.label = Retención del cuerpo tras resolverse (segundos)
#@src 53f13e279db8
settings.field.comm_body_retention_sec.help = Cuánto sobrevive el TEXTO de un mensaje después de que se confirme o caduque. CERO restaura el comportamiento antiguo de borrar el cuerpo en cuanto se confirma — un comportamiento que destruyó el 97 % de los cuerpos de los mensajes de una instancia por la vía normal de sondear, actuar y confirmar, porque la bandeja de mensajes sin confirmar era el único sitio donde llegaba a existir un cuerpo.
#@src 92a9301fb57d
settings.field.comm_metadata_ttl_sec.label = Retención de metadatos (segundos)
#@src a0982dc933a9
settings.field.comm_metadata_ttl_sec.help = Cuánto sobrevive el registro de un mensaje ya resuelto, contado desde que se creó. NOTA: como ahora los cuerpos sobreviven a la confirmación (ver Retención del cuerpo), este es además el ÚNICO límite para un cuerpo que nunca se entregó — la retención no puede liberarlo, porque un mensaje que nadie recibió no tiene momento de resolución desde el que medir. Subirlo para alargar el rastro de auditoría hace crecer con él los bytes retenidos de mensajes sin entregar.
#@src 08fd1a7bdc94
settings.field.comm_reply_deadline_sec.label = Plazo de respuesta (segundos)
#@src 91d5f5ea50ed
settings.field.comm_reply_deadline_sec.help = Plazo por defecto para un mensaje que requiere respuesta; superado, se avisa al remitente de que la respuesta se ha retrasado en lugar de esperar indefinidamente.
#@src 6acf19a7d149
settings.field.comm_pairing_code_ttl_sec.label = Vida del código de emparejamiento (segundos)
#@src 3c34b9ce9258
settings.field.comm_pairing_code_ttl_sec.help = Cuánto tiempo sigue siendo válido un código que emites. Corto es mejor: solo tiene que durar lo que tardas en pegarlo en dos sesiones.
#@src 852a1f7a1e58
settings.field.comm_poll_wait_max_sec.label = Espera máxima de sondeo largo (segundos)
#@src aa80b78fd96d
settings.field.comm_poll_wait_max_sec.help = Límite del tiempo que puede bloquearse una llamada de recepción. El código lo recorta a 30 en todo caso: una espera que iguala el tiempo límite de herramienta del cliente convierte un sondeo vacío correcto en un error.
#@src 1ee958e8488f
settings.field.comm_provenance_window_sec.label = Ventana de información de segunda mano (segundos)
#@src fd98c5986fe8
settings.field.comm_provenance_window_sec.help = Si un token recibió un mensaje entre sesiones en este intervalo, las entradas que redacte se marcan en la cola de revisión como posiblemente de segunda mano. 0 desactiva la marca.
#@src c5f9dbaad6fe
settings.field.comm_files_enabled.label = Intercambio de archivos activado
#@src 305356469072
settings.field.comm_files_enabled.help = Permite a las sesiones emparejadas intercambiar archivos (entrega en el mismo equipo o retransmisión a través de Ken). ACTIVADO por defecto, como toda función de Ken. Desactívalo para que la retransmisión deje de escribir bytes en el disco de este servidor — surte efecto de inmediato, sin reiniciar, que es lo que lo hace útil durante un incidente.
#@src 2cf191d2901f
settings.field.comm_file_max_mb.label = Tamaño máximo de archivo (MB)
#@src ec40dadd7447
settings.field.comm_file_max_mb.help = Límite para un archivo ofrecido o retransmitido.
#@src 49f5d4afd53b
settings.field.comm_file_budget_mb.label = Presupuesto de almacenamiento (MB)
#@src 0ec17ebc4366
settings.field.comm_file_budget_mb.help = Límite global de bytes retenidos a la vez en la retransmisión. Comparte el disco de este servidor con la base de conocimiento; llenarlo haría fallar las escrituras duraderas por tráfico efímero.
#@src 5fbbaf6373f1
settings.field.comm_file_min_free_mb.label = Suelo de espacio libre (MB)
#@src c20acdc7d15d
settings.field.comm_file_min_free_mb.help = Las subidas se rechazan cuando el disco tiene menos espacio libre que esto, incluso dentro del presupuesto, para que la base de conocimiento siempre tenga margen. 0 desactiva el suelo.
#@src 071f3d4de393
settings.field.comm_file_ttl_sec.label = Vida del archivo (segundos)
#@src 2881a8e66579
settings.field.comm_file_ttl_sec.help = Cuánto sobrevive un archivo ofrecido o no entregado antes de caducar y de que sus bytes se borren.
#@src 259bc922ea51
settings.field.comm_grant_ttl_sec.label = Vida del permiso de transferencia (segundos)
#@src 4909a3b31075
settings.field.comm_grant_ttl_sec.help = Cuánto tiempo es válida una URL de subida/descarga de un solo uso. Corto es lo correcto: solo tiene que durar lo que tardas en pasársela a curl.
#@src 241404d92614
settings.field.comm_endpoint_idle_sec.label = Limpieza de sesiones inactivas (segundos)
#@src 9bb9974dbec6
settings.field.comm_endpoint_idle_sec.help = Cuánto sobrevive una sesión registrada sin tráfico de mensajes antes de eliminarse. Una sesión que sondea activamente actualiza su última actividad y nunca se elimina; esto solo retira sesiones que se registraron y se fueron. Mantenlo holgadamente por encima de los intervalos de inactividad de una sesión en pleno trabajo.
comm.stat_files = Archivos pendientes de entrega
comm.stat_file_bytes = Bytes de retransmisión en disco


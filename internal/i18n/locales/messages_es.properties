flash.station_link_revoke_failed = No se pudo revocar el vínculo: {0}
flash.station_link_revoked_channels_failed = El vínculo {0} se revocó, pero no se pudieron cerrar sus canales activos. Ciérrelos desde la consola de Comm.
flash.station_link_revoked_comm_off = Vínculo terminado: {0}. La base de datos de mensajes no está abierta en este servidor, así que no se pudieron comprobar ni cerrar sus canales — puede que sigan abiertos. Es una avería, no un ajuste: nada apaga COMM. Busca una línea COMM: DEGRADED en el registro, arregla la base de datos y vuelve a comprobar desde la consola de Comm.

# Rotación del secreto de un endpoint. Solo se puede hacer desde esta consola
# autenticada — nunca desde una herramienta — porque un token cubre una máquina
# entera: lo que pudiera activar una sesión, podría activarlo cualquier sesión.
comm.rotate = Rotar secreto
comm.rotate_help = Emite un secreto nuevo para este endpoint. Conserva su id y todos sus canales, así que los pares no se ven afectados y no hay que volver a emparejar nada.
comm.rotate_confirm = ¿Rotar el secreto de este endpoint? El anterior deja de funcionar de inmediato y la sesión que lo usa no podrá enviar ni recibir hasta que le des el nuevo.
comm.rotated = rotado
comm.rotated_help = El secreto de este endpoint se ha reemplazado al menos una vez.
comm.rotated_heading = Nuevo secreto del endpoint
comm.rotated_help_body = Dale ambos valores a la sesión dueña de este endpoint. Sus canales quedan intactos — puede seguir donde lo dejó. Dile que los escriba en un archivo en disco, no que confíe en recordarlos.
comm.rotated_warn = Esta es la única vez que se muestra el secreto. Solo se guarda su hash, y el secreto anterior ya no sirve.
flash.comm_rotate_failed = No se pudo rotar el secreto: {0}

# Los diálogos de confirmación dicen a QUÉ afectan. Las etiquetas de los endpoints las
# elige el agente, así que con el tiempo se parecen todas; los canales sí se reconocen.
comm.confirm_endpoint = Sesión
comm.confirm_channels = Sus canales
comm.revoke_bound_endpoint_confirm = ¿Revocar el endpoint de esta sesión? No se puede deshacer y corta la sesión que tiene este secreto en su próxima llamada. La ESTACIÓN conserva sus canales: una sesión de reemplazo se vincula con un vale y los hereda, sin volver a emparejar. Si el secreto solo se filtró o se perdió, use ROTAR — eso mantiene la sesión funcionando.
comm.confirm_station_keeps = Canales que conserva esta estación
comm.confirm_will_close = Canales que se cerrarán
comm.rotated_dont_leave = No salgas de esta página hasta haber pegado este valor en la sesión. El secreto anterior ya no sirve.
comm.copy = Copiar
comm.copy_help = Copia el secreto al portapapeles.
comm.copied = Copiado
comm.saved_it = Ya lo guardé
comm.saved_it_help = Oculta el secreto y deja de avisarte al salir de la página.

stations.link_wants = quiere hablar con
stations.link_grants = Aprobar permite que estas dos estaciones intercambien mensajes privados, y abre esa conversación de inmediato si ambas están atendidas. NO pone a ninguna en una sala y no amplía el alcance de difusión de nadie.
stations.link_help = Aprobar permite que estos dos puestos abran canales entre sí cuando lo necesiten, sin que tengas que emitir un código cada vez. Se revoca después con un clic.
stations.link_approve = Aprobar este enlace
stations.link_approve_help = Crea una relación permanente entre los dos puestos.
stations.link_revoke = Revocar
stations.link_revoke_help = Termina la relación y cierra cualquier canal que autorizó.
stations.link_revoke_confirm_unknown = ¿Revocar el vínculo entre {0} y {1}? Cuántos canales vivos cierra esto es DESCONOCIDO — la base de datos de mensajes no está abierta, así que no se pudo leer el número. Es una avería, no un ajuste; nada apaga COMM. Ambos puestos conservan sus cuadernos, tareas e historial; solo termina el permiso para hablar y el tráfico que aún lleve.
stations.link_revoke_confirm = ¿Revocar el vínculo entre {0} y {1}? Se cerrarán {2} canal(es) activo(s). Ambas estaciones conservan sus cuadernos, tareas e historial — solo terminan el permiso para comunicarse y su tráfico actual.
flash.link_approved_open = Enlace aprobado: {0} — y su conversación privada está abierta, lista para usar sin código de emparejamiento.
flash.link_approved = Enlace aprobado: {0}

stations.key_id = Id de la clave
stations.key_actor = Actor
stations.key_actor_nocomm = sin token COMM
stations.key_actor_nocomm_help = Esta clave se emitio bajo un actor que no posee ningun token COMM. La clave funciona para todas las herramientas de estacion, pero no puede vincular un extremo: la vinculacion exige que el token COMM del extremo y esta clave pertenezcan al mismo actor. Emita una clave bajo el actor que posee el token COMM de esta maquina.
stations.key_created = Creada
stations.key_unmeasured = sin medir
stations.key_not_audited = Se registra desde 1.5.3, con un límite de aproximadamente una vez por minuto. Un blanco significa que esta clave no se ha autenticado desde entonces, no que el uso no se registre. Compruébalo antes de retirar una clave: es la única señal que indica si algo la sigue usando.

stations.promotions_heading = Paginas que un puesto quiere promover a conocimiento
stations.promotions_lede = Una sesion le pidio convertir una de sus paginas de cuaderno en una entrada de la base de conocimiento. Leala aqui y guardela usted si corresponde: esta pagina nunca escribe conocimiento.
stations.promotions_hearsay = posiblemente de segunda mano
stations.promotions_hearsay_help = Esta pagina se escribio mientras su puesto recibia mensajes de otra sesion, asi que parte del contenido puede no ser de primera mano. Pida una fuente antes de promover.
stations.promotions_moved = la pagina cambio despues
stations.promotions_moved_help = La pagina se edito despues de esta solicitud, asi que el texto de abajo no es el que la sesion le pidio revisar.
stations.promotions_slug_placeholder = slug de la entrada, si guardo una
stations.promotions_slug_help = Opcional. Registrar en que entrada se convirtio deja un rastro de la nota al conocimiento.
stations.promotions_converted = Marcar convertida
stations.promotions_converted_help = Cierra la solicitud. Guarde la entrada usted primero: este boton registra su decision, no escribe conocimiento.
stations.promotions_discard = Descartar
stations.promotions_discard_help = Cierra la solicitud sin convertir. La pagina del cuaderno queda intacta.
flash.promotion_converted = Marcada como convertida.
flash.promotion_discarded = Solicitud descartada.
flash.promotion_already_decided = Esa solicitud ya estaba decidida.
flash.promotion_failed = No se pudo resolver la solicitud


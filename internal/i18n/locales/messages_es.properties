comm.credentials_heading = Credenciales de las que dependen estos puntos finales
comm.credentials_help = Un punto final vivo responde a dos credenciales, y revocar cualquiera de las dos lo termina. Muévelas aquí antes de revocar nada — después no hay vuelta atrás. Retirar una clave de puesto es distinto: detiene la clave pero deja funcionando las sesiones COMM que vinculó.
comm.binders_help = Un punto final vinculado lleva además la clave de puesto que autorizó el vínculo. Esa clave se comprueba en cada llamada, así que revocarla o borrarla desconecta la sesión aunque su token siga intacto. Un vínculo solo puede moverse a otra clave del mismo puesto.

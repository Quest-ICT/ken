comm.repoint_help = Mueve este punto final a otro token. Conserva su id, su secreto, sus canales, su vínculo con el puesto y todo lo que tenga en cola — solo cambia qué credencial puede usarlo. La sesión necesita que su configuración MCP apunte al nuevo token y reiniciarse.

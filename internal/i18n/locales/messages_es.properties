# Rotación del secreto de un endpoint. Solo se puede hacer desde esta consola
# autenticada — nunca desde una herramienta — porque un token cubre una máquina
# entera: lo que pudiera activar una sesión, podría activarlo cualquier sesión.
comm.rotate = Rotar secreto
comm.rotate_help = Emite un secreto nuevo para este endpoint. Conserva su id y todos sus canales, así que los pares no se ven afectados y no hay que volver a emparejar nada.
comm.rotate_confirm = ¿Rotar el secreto de este endpoint? El anterior deja de funcionar de inmediato y la sesión que lo usa no podrá enviar ni recibir hasta que le des el nuevo.
comm.rotated = rotado
comm.rotated_help = El secreto de este endpoint se ha reemplazado al menos una vez.
comm.rotated_heading = Nuevo secreto del endpoint
comm.rotated_help_body = Dale ambos valores a la sesión dueña de este endpoint. Sus canales quedan intactos — puede seguir donde lo dejó. Dile que los escriba en un archivo en disco, no que confíe en recordarlos.
comm.rotated_warn = Esta es la única vez que se muestra el secreto. Solo se guarda su hash, y el secreto anterior ya no sirve.
flash.comm_rotate_failed = No se pudo rotar el secreto: {0}


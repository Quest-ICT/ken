stations.rename = Renombrar
stations.rename_help = Cómo se llama este puesto, y nada más. Nada se dirige a un puesto por su nombre, así que renombrarlo no rompe ningún enlace, canal ni mensaje — cada lugar donde aparecía el nombre anterior muestra el nuevo de inmediato.

flash.comm_rebind_nothing_moved = No se movió nada. La clave que elegiste pertenece al puesto {0}, y un vínculo solo puede moverse a una clave del mismo puesto — o el punto final ya se había movido, o revocado, o fue barrido mientras esta página estaba abierta. No se cambió nada.

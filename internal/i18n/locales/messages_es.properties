comm.repoint_all = Reasignar todos
comm.repoint_all_help = Mueve de una vez todos los puntos finales vivos de este token a otro token. Cada sesión conserva su id, su secreto, sus canales, su vínculo y su correo en cola; cada una necesita el nuevo token en su configuración MCP y reiniciarse.
comm.repoint_all_confirm = ¿Mover todos los puntos finales vivos de este token al token seleccionado? Cada una de esas sesiones será rechazada hasta que su configuración nombre el nuevo token y se reinicie.

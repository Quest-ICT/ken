#@src 46d5d7e754a7
settings.field.comm_claim_lease_sec.help = Cuando varias sesiones atienden un mismo puesto, la primera que consulta un mensaje lo reserva y las demás no lo ven. Esto es cuánto dura esa reserva antes de que el mensaje vuelva a estar disponible.
#@src 0e0cd4996fd0
settings.field.station_locker_blob_kib.label = Tamaño de archivo del casillero (KiB)
#@src 6750ae49ca41
settings.field.station_locker_blob_kib.help = El archivo más grande que un puesto puede guardar. El casillero es para memoria y archivos de instrucciones, no para cargas útiles.
#@src 8ce7a57dfbf2
settings.field.station_locker_total_kib.label = Casillero por puesto (KiB)
#@src 9c20fea87261
settings.field.station_locker_total_kib.help = Almacenamiento total de casillero que puede usar un puesto. Todo lo que hay aquí llega literalmente a tus respaldos, y Ken no puede inspeccionarlo.
#@src 193910078133
settings.field.station_max_open_tasks.label = Tareas abiertas por puesto
#@src 3d23f0ab45f3
settings.field.station_max_open_tasks.help = Cuántas tareas puede tener abiertas un puesto a la vez. Una lista más larga que esto no se está trabajando, y rechazar es más honesto que dejarla crecer.
#@src 8ccd7656160f
settings.field.station_note_page_kib.label = Tamaño de página del cuaderno (KiB)
#@src 7d4db0bc76e1
settings.field.station_note_page_kib.help = Lo más grande que puede ser una página del cuaderno. Una página mayor que esto es un documento y no una nota, y las páginas viajan en cada respaldo.
#@src 542a1970a99a
settings.field.station_note_revision_kib.label = Historial de revisiones por página (KiB)
#@src 2e32b52e1d94
settings.field.station_note_revision_kib.help = Cuánto historial de edición conserva una página antes de descartar las revisiones más antiguas. Es un búfer para deshacer, no un archivo histórico: existe para que una sesión pueda recuperarse de su propio error.
#@src 0aed5c2460b4
settings.field.station_notebook_kib.label = Cuaderno por puesto (KiB)
#@src fe7ab9cf3fb2
settings.field.station_notebook_kib.help = Tamaño total de las páginas actuales del cuaderno de un puesto, sin contar el historial. Unas sesenta páginas completas con el tamaño de página predeterminado.
#@src 9bfa0b341657
settings.field.station_task_detail_bytes.label = Tamaño del detalle de tarea (bytes)
#@src f6de043d2041
settings.field.station_task_detail_bytes.help = El detalle y el contexto opcionales de una tarea. Una tarea que necesita más que esto es en realidad una página de cuaderno con un plan.
#@src 0e9596731c48
settings.field.station_task_list_limit.label = Tamaño de página del listado de tareas
#@src e789dded42ee
settings.field.station_task_list_limit.help = El número predeterminado Y máximo de tareas que devuelve un listado. Acota cuánto de la pila puede traer una sesión a su contexto de una vez.
#@src 80085d0c6cb1
settings.field.station_task_text_bytes.label = Longitud de línea de tarea (bytes)
#@src b206db922b71
settings.field.station_task_text_bytes.help = El resumen de una línea de una tarea y su línea de resolución. Cortos por diseño: lo que necesite más pertenece al campo de detalle o a una página del cuaderno.
#@src 792ea76a97eb
settings.field.station_vault_entries.label = Secretos por puesto
#@src 19c325d5e26d
settings.field.station_vault_entries.help = Cuántas credenciales puede guardar un puesto. Todo lo que hay aquí se almacena SIN CIFRAR y viaja en cada respaldo — la protección es la máquina y el respaldo, no Ken.
#@src 05fdb06a4b3d
settings.field.station_vault_history_rev.label = Versiones de bóveda por secreto
#@src 3ed6de63cf7c
settings.field.station_vault_history_rev.help = Cuántos valores reemplazados siguen siendo recuperables tras una sobrescritura o un borrado. Es lo que hace reversible una escritura en la bóveda; en 0, una sobrescritura es definitiva.
#@src bde3a7f2c14e
settings.field.station_vault_read_log.label = Lecturas de bóveda conservadas por puesto
#@src 0874749942dd
settings.field.station_vault_read_log.help = Cuántos registros de lectura conserva el rastro de auditoría. El CONTEO de lecturas por secreto es exacto de todos modos, así que bajar esto acorta el rastro sin ocultar con qué frecuencia se leyó algo.
#@src 612cbe30af67
settings.field.station_vault_secret_kib.label = Tamaño de secreto de bóveda (KiB)
#@src 8b5d5ec05ee1
settings.field.station_vault_secret_kib.help = La credencial individual más grande que puede guardar un puesto. Una clave privada PEM cabe; algo mayor es un archivo, y los archivos van en el casillero.
rooms.heading = Salas
rooms.lede = Una sala permite que varios puestos conversen a la vez: un mensaje llega a todos los miembros y cada uno responde por sí mismo. Las sesiones no pueden crear salas — tú decides quién está en una. Un puesto añadido hoy no ve nada de lo enviado antes de unirse.
rooms.members = miembros
rooms.deaf = no puede recibir
rooms.deaf_help = Uno o más miembros no tienen ninguna sesión vinculada, así que están en la sala sobre el papel y no reciben nada de lo que se envía a ella.
rooms.deaf_lede = Algunos miembros aún no pueden recibir. Añadir un puesto a una sala es correcto y permanente — pero un puesto solo escucha cuando alguna de sus sesiones ha vinculado un punto final. Pide a esa sesión que llame a station_binding_voucher y luego a comm_bind; nada de lo enviado mientras tanto se pierde: espera hasta 30 días.
rooms.member_deaf = sin vincular
rooms.member_deaf_help = Ninguna sesión está vinculada a este puesto, así que no recibe nada de lo enviado a esta sala. Su membresía está bien y es permanente; la sesión necesita vincularse. El correo ya enviado le espera.
rooms.member = Puesto
rooms.added = Añadido
rooms.add = Añadir a la sala
rooms.add_help = El puesto se une a partir de ahora. No verá nada de lo que la sala dijo antes de hoy.
rooms.remove = Quitar
rooms.remove_help = Saca al puesto de la sala. Los mensajes ya enviados siguen en su bandeja — la audiencia se decidió al enviar cada uno.
rooms.archive = Archivar
rooms.unarchive = Reabrir
rooms.archive_help = Detiene de inmediato la aceptación de nuevos mensajes en la sala. Su historial conserva su dirección, y reabrirla la restaura.
rooms.archived = archivada
rooms.archived_help = Esta sala no acepta mensajes nuevos. No se ha borrado nada.
rooms.create = Crear sala
rooms.create_help = Crea la sala vacía. Añade puestos después.
rooms.new_name = Nombre de la sala
rooms.new_name_help = Cómo se referirán a ella las sesiones. Corto y específico es mejor que descriptivo.
rooms.new_purpose = Para qué es
rooms.new_purpose_help = Opcional. Se muestra aquí para ti; no se envía a las sesiones.
flash.room_created = Sala {0} creada. Añádele puestos.
flash.room_name_required = Escribe un nombre para la sala.
flash.room_create_failed = No se pudo crear esa sala: {0}
flash.room_member_failed = No se pudo cambiar esa membresía: {0}
flash.room_membership_saved = Membresía de la sala actualizada.
flash.room_archive_failed = No se pudo archivar esa sala: {0}
flash.room_archived = Sala actualizada.
proposals.via_comm_broadcast = ¿escuchado en una sala?
proposals.via_comm_directed_hint = Mientras se escribía esto, otra sesión había enviado un mensaje DIRECTAMENTE a la identidad que lo escribió. No es prueba de que la entrada venga del mensaje — la comprobación no puede ver el contenido — pero es la más fuerte de las dos señales. Pide una fuente antes de promover.
proposals.via_comm_broadcast_hint = Mientras se escribía esto, la identidad que lo escribió era uno de varios destinatarios de un mensaje de sala. Más débil que un mensaje dirigido: estar en una sala donde se dijo algo es común, y una difusión marca a todos los miembros a la vez.
#@src 63bc242b2011
settings.field.rl_enabled.help = Activa o desactiva por completo la protección contra abuso — límites por IP y por token, bloqueo automático, todo. Desactivada, cada petición llega a la aplicación.
#@src ccd3ee6b8319
settings.field.rl_token_burst.help = Tamaño del depósito para un token de agente — absorbe que una sesión haga varias llamadas en un mismo turno sin contarlas contra su ritmo sostenido.
#@src 1d544e294962
settings.field.rl_lockout_sec.help = Cuánto tiempo permanece bloqueada una IP bloqueada automáticamente. El bloqueo es un 403 devuelto antes de que la petición entre en la cadena, así que rechazar a alguien bloqueado no cuesta nada.
#@src aedb9a4ff35e
settings.field.login_lockout_sec.help = Cuánto tiempo se rechaza una IP tras demasiados inicios de sesión fallidos. Se aplica por realm, así que quedar bloqueado en una consola no te bloquea en otra.

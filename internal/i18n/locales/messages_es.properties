stations.vault_help = Credenciales que guarda esta estación. Los valores nunca se listan — revelar uno es una acción aparte y queda registrada.
stations.vault_lede = Secretos que una sesión guardó aquí. Se conservan SIN CIFRAR: cualquiera que pueda leer esta máquina o una copia de seguridad puede leerlos, así que la protección es el host y la copia, no Ken. Cada lectura de abajo queda registrada, y nada aquí se destruye — una sobrescritura o un borrado sigue siendo recuperable.

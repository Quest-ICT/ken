comm.rebind = Revincular
comm.rebind_help = Apunta el vínculo de este punto final a otra clave del mismo puesto. Conserva su id, su secreto, sus canales, su puesto y todo lo que tenga en cola — solo cambia qué clave puede desconectarlo. Nada cambia para la sesión en curso.
comm.rebind_confirm = ¿Apuntar el vínculo de este punto final a la clave seleccionada? No cambia nada de la sesión — cambia la clave que podría desconectarla.
comm.rebind_all = Revincular todos
comm.rebind_all_help = Apunta de una vez todos los puntos finales vivos que vinculó esta clave a otra clave del mismo puesto. Hazlo antes de revocar la clave: revocarla corta esos puntos finales y nada puede des-revocarlos. Retirar la clave no los corta.
comm.rebind_all_confirm = ¿Apuntar todos los puntos finales que vinculó esta clave a la clave seleccionada? Las sesiones siguen funcionando; solo cambia la clave que podría desconectarlas.
flash.comm_rebound = Punto final {0} revinculado. Su id, su secreto, sus canales, su puesto y su correo en cola no cambian; la sesión no necesita reiniciarse.

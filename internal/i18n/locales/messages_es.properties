stations.archive_help = Es reversible. Detiene COMM — no se dirige correo nuevo aquí y ninguna sesión puede actuar como este puesto — y los enlaces quedan en reposo. Las claves siguen funcionando: el cuaderno, las tareas, el casillero y la bóveda siguen accesibles, y se conserva el nombre. Para detener también una clave, retírala o revócala.

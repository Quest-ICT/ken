comm.credentials_help = A live endpoint answers to two credentials, and revoking either one ends it. Move them here before you revoke anything — after the fact there is no way back. Retiring a station key is different: it stops the key but leaves the COMM sessions it bound running.
comm.credentials_heading = Credentials these endpoints depend on

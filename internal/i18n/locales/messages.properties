settings.group.inter_session_comms = Inter-session comms
settings.field.comm_max_body_bytes.label = Max message size (bytes)
settings.field.comm_max_body_bytes.help = Message bodies are atomic; there is no multi-part send. Keep this small — tool arguments are generated token by token by a model, so even 64 KiB is a five-figure token count.
settings.field.comm_max_unacked.label = Max unacknowledged per channel
settings.field.comm_max_unacked.help = Backpressure. Past this a send is refused so two auto-processing sessions cannot loop unboundedly.
settings.field.comm_message_ttl_sec.label = Lifetime after delivery (seconds)
settings.field.comm_message_ttl_sec.help = How long a DELIVERED but unacknowledged message survives. The clock starts when the recipient is first handed the message, not when it was sent — a session goes 16 h between pulls on a weeknight and 64 h over a weekend, so a send-anchored clock expired mail during the exact window nobody could read it.
settings.field.comm_metadata_ttl_sec.label = Metadata retention (seconds)
settings.field.comm_metadata_ttl_sec.help = How long a settled message's row survives after it was created. NOTE: since bodies now survive acknowledgement (see Body retention), this is also the ONLY bound on a body that was never delivered — retention cannot reclaim one, because a message nobody received has no settle time to measure from. Raising this for a longer audit trail multiplies retained undelivered bytes with it.
settings.field.comm_reply_deadline_sec.label = Reply deadline (seconds)
settings.field.comm_reply_deadline_sec.help = Default deadline for a message that requires a response; past it the sender is told the reply is overdue instead of waiting forever.
settings.field.comm_pairing_code_ttl_sec.label = Pairing code lifetime (seconds)
settings.field.comm_pairing_code_ttl_sec.help = How long a code you mint stays usable. Short is good: it only has to survive being pasted into two sessions.
settings.field.comm_poll_wait_max_sec.label = Max long-poll wait (seconds)
settings.field.comm_poll_wait_max_sec.help = Ceiling on how long a receive call may block. Clamped to 30 in code regardless: a wait that ties the client's tool timeout turns a successful empty poll into an error.
settings.field.comm_provenance_window_sec.label = Hearsay window (seconds)
settings.field.comm_provenance_window_sec.help = If a token received an inter-session message this recently, entries it authors are flagged on the review queue as possibly second-hand. 0 disables the flag.
settings.field.comm_files_enabled.label = File exchange enabled
settings.field.comm_files_enabled.help = Lets paired sessions exchange files (same-host handoff, or relayed through Ken). ON by default, like every Ken feature. Turn it OFF to stop the relay writing bytes to this server's disk — it applies immediately, with no restart, which is what makes it useful mid-incident.
settings.field.comm_file_max_mb.label = Max file size (MB)
settings.field.comm_file_max_mb.help = Cap on one relayed or offered file.
settings.field.comm_file_budget_mb.label = Relay storage budget (MB)
settings.field.comm_file_budget_mb.help = Global cap on bytes held in the relay at once. The relay shares this server's disk with the knowledge base; filling it would fail durable writes over chat traffic.
settings.field.comm_file_min_free_mb.label = Free-space floor (MB)
settings.field.comm_file_min_free_mb.help = Uploads are refused when the disk has less than this free, even under budget, so the knowledge base always has headroom. 0 disables the floor.
settings.field.comm_file_ttl_sec.label = File lifetime (seconds)
settings.field.comm_file_ttl_sec.help = How long an offered or undelivered file survives before it expires and its bytes are deleted.
settings.field.comm_grant_ttl_sec.label = Transfer grant lifetime (seconds)
settings.field.comm_grant_ttl_sec.help = How long a one-time upload/download URL stays valid. Short is right: it only has to survive being handed to curl.
settings.field.comm_endpoint_idle_sec.label = Idle session cleanup (seconds)
settings.field.comm_endpoint_idle_sec.help = How long a registered session with no message traffic survives before it is removed. An actively polling session refreshes its last-seen and is never removed; this only reaps sessions that registered and went away. Keep it comfortably longer than a working session's idle gaps.

settings.field.comm_body_retention_sec.help = How long a message's TEXT survives after it is acknowledged or expires. ZERO restores the old behaviour of deleting the body the moment it is acknowledged — which destroyed 97% of one deployment's message bodies through the ordinary poll/act/acknowledge path, because the unacknowledged inbox was the only place a body ever existed.
settings.field.comm_body_retention_sec.label = Body retention after settling (seconds)
settings.field.comm_claim_lease_sec.help = When several sessions staff one station, the first to poll a message claims it and the others do not see it. This is how long that claim lasts before the message returns to the queue for another session to pick up. It only matters if you use stations; too short and a session still working gets undercut, too long and a session that died holds its messages out of reach.
settings.field.comm_claim_lease_sec.label = Station claim lease (seconds)
settings.field.comm_undelivered_ttl_sec.help = Backstop for a message NOBODY has ever polled — it only bounds mail addressed to an endpoint that never comes back. Undelivered mail is bounded first by the per-channel unacknowledged cap, which is a volume limit and therefore immune to how long a human is away. Set this longer than the longest absence you expect: a fortnight's leave is 400 h.
settings.field.comm_undelivered_ttl_sec.label = Lifetime before delivery (seconds)
settings.field.login_lockout_sec.help = How long an IP is refused after too many failed logins. Applies per realm, so locking out of one console does not lock you out of another.
settings.field.rl_enabled.help = Turns the whole abuse guard on or off — per-IP and per-token limits, auto-blocking, the lot. Off means every request reaches the application.
settings.field.rl_lockout_sec.help = How long an auto-blocked IP stays blocked. Blocking is a 403 returned before the request enters the chain, so a blocked caller costs nothing to refuse.
settings.field.rl_token_burst.help = Bucket size for one agent token — absorbs a session firing several calls in one turn without counting them against its sustained rate.
settings.field.station_locker_blob_kib.help = The largest single file a station may store. The locker is for memory and instruction files, not payloads.
settings.field.station_locker_blob_kib.label = Locker file size (KiB)
settings.field.station_locker_total_kib.help = Total locker storage one station may use. Everything here lands verbatim in your backups, and Ken cannot inspect it.
settings.field.station_locker_total_kib.label = Locker per station (KiB)
settings.field.station_max_open_tasks.help = How many tasks a station may have open at once. A list longer than this is not being worked, and refusing is more honest than letting it grow.
settings.field.station_max_open_tasks.label = Open tasks per station
settings.field.station_note_page_kib.help = The largest a single notebook page may be. A page bigger than this is a document rather than a note, and notebook pages travel in every backup.
settings.field.station_note_page_kib.label = Notebook page size (KiB)
settings.field.station_note_revision_kib.help = How much edit history one page keeps before the oldest revisions are dropped. This is an undo buffer, not an archive — it exists so a session can recover from its own bad overwrite.
settings.field.station_note_revision_kib.label = Revision history per page (KiB)
settings.field.station_notebook_kib.help = Total size of a station's current notebook pages, excluding history. Roughly sixty full pages at the default page size.
settings.field.station_notebook_kib.label = Notebook per station (KiB)
settings.field.station_task_detail_bytes.help = The optional detail and context attached to a task. A task needing more than this is really a notebook page with a plan.
settings.field.station_task_detail_bytes.label = Task detail size (bytes)
settings.field.station_task_list_limit.help = The default AND maximum number of tasks one listing returns. It bounds how much of the pile a session can pull into its context at once.
settings.field.station_task_list_limit.label = Task list page size
settings.field.station_task_text_bytes.help = A task's one-line summary and its resolution line. Short by construction: anything needing more belongs in the detail field or a notebook page.
settings.field.station_task_text_bytes.label = Task line length (bytes)

# The hearsay badge, in two strengths. Before rooms every message had one recipient,
# so "received something" meant "somebody wrote to you". A broadcast to nine stations
# marks nine actors from one send, which is why the badge says which it saw.
proposals.via_comm_broadcast = heard in a room?
proposals.via_comm_directed_hint = While this was written, another session had sent a message DIRECTLY to the identity that wrote it. That is not proof the entry came from the message — the check cannot see content — but it is the stronger of the two signals. Ask for a source before promoting.
proposals.via_comm_broadcast_hint = While this was written, the identity that wrote it was one of several recipients of a room message. Weaker than a directed message: being in a room where something was said is common, and one broadcast marks every member at once.

# --- rooms -------------------------------------------------------------------
# A room is a set of stations a HUMAN named and filled. There is no agent path to
# create one, deliberately, so this console is the only door.
rooms.heading = Rooms
rooms.lede = A room lets several stations talk at once: one message reaches every member, and each of them answers for itself. Sessions cannot create rooms — you decide who is in one. A station added today sees nothing sent before it joined.
rooms.members = members
# D1: a station with no bound endpoint is a member on paper and deaf in practice. The
# console used to admit it silently; ken-promo concluded from the resulting silence that
# rooms were receive-only, and said so to its human.
rooms.deaf = cannot receive
rooms.deaf_help = One or more members have no session bound to them, so they are in this room on paper and receive nothing sent to it.
rooms.deaf_lede = Some members cannot receive yet. Adding a station to a room is correct and permanent — but a station only hears once one of its sessions has bound an endpoint to it. Ask that session to call station_binding_voucher and then comm_bind; nothing sent meanwhile is lost, it waits for up to 30 days.
rooms.member_deaf = not bound
rooms.member_deaf_help = No session is bound to this station, so it receives nothing sent to this room. Its membership is fine and permanent; the session needs to bind. Mail already sent waits for it.
rooms.member = Station
rooms.added = Added

flash.station_link_revoked_channels_failed = The link {0} was revoked, but its live channels could not be closed. Close them from the Comm console.
flash.station_link_revoked_comm_off = Link ended: {0}. The message database is not open on this server, so the link's channels could not be checked or closed — they may still be open. This is a fault, not a setting: nothing turns COMM off. Look for a COMM: DEGRADED line in the server log, fix the database, then re-check from the Comm console.

# Rotating an endpoint secret. Reachable only from this authenticated console —
# never from a tool — because one bearer token covers a whole machine, so anything
# a session could trigger, any session on that machine could trigger.
comm.reassign = Reassign
comm.reassign_help = Point this mailbox at a conversation. Ask the session for its conversation key, paste it here, and its next poll reads the mail already waiting. Empty releases the mailbox. The key selects; the owner token above still decides who may drive it.
comm.reassign_placeholder = conversation key
comm.reassign_confirm = Point this mailbox at a different conversation? Its id, channels, station binding and queued mail all stay; only the conversation that drives it changes.
flash.comm_reassigned = Endpoint {0} now answers to that conversation. Tell the session to poll with the same key.
flash.comm_released = Endpoint {0} is released. Only its secret can drive it now, so rotate it if nobody holds one.
flash.comm_reassigned_taken = Reassigned. The key was taken from endpoint {0}, which no conversation drives now.
flash.comm_reassign_failed = Could not reassign: {0}
comm.rotated = rotated
comm.rotated_help = This endpoint's secret has been replaced at least once.

# Confirm dialogs name WHAT they will affect. Endpoint labels are agent-supplied, so
# after a few weeks they all look alike; channels are what an operator recognises.
comm.confirm_endpoint = Session
comm.confirm_channels = Its channels
comm.revoke_bound_endpoint_confirm = Revoke this session's endpoint? This cannot be undone, and it cuts off the session holding this secret at its next call. The STATION keeps its channels: a replacement session binds with a voucher and inherits them, with no re-pairing. If the secret merely leaked or was lost, ROTATE instead — that keeps the session working.
comm.confirm_station_keeps = Channels this station keeps
comm.confirm_will_close = Channels that will close

stations.link_suspend = Suspend
stations.link_suspend_help = Turns this relationship off. Live channels close; the link stays listed and you can resume it at any time.
stations.link_suspend_confirm = Suspend the link between {0} and {1}? This closes {2} live channel(s). The link stays listed and Resume turns it back on — the channels do not come back, because the sessions that held them are gone.
stations.link_suspend_confirm_unknown = Suspend the link between {0} and {1}? Ken cannot count the live channels right now, so assume there are some. The link stays listed and Resume turns it back on.
stations.link_resume = Resume
stations.link_resume_help = Turns this relationship back on. The stations can address each other again; old channels are not restored.


# Added by i18nsync from settings.Fields — English here is GENERATED, not authored.
# Edit the Go registry, then run: go run ./internal/i18n/i18nsync
settings.field.comm_body_retention_sec.help = How long a message's TEXT survives after it is acknowledged or expires. ZERO restores the old behaviour of deleting the body the moment it is acknowledged — which destroyed 97% of one deployment's message bodies through the ordinary poll/act/acknowledge path, because the unacknowledged inbox was the only place a body ever existed.
settings.field.comm_body_retention_sec.label = Body retention after settling (seconds)
settings.field.comm_claim_lease_sec.help = When several sessions staff one station, the first to poll a message claims it and the others do not see it. This is how long that claim lasts before the message returns to the queue for another session to pick up. It only matters if you use stations; too short and a session still working gets undercut, too long and a session that died holds its messages out of reach.
settings.field.comm_claim_lease_sec.label = Station claim lease (seconds)
settings.field.comm_undelivered_ttl_sec.help = Backstop for a message NOBODY has ever polled — it only bounds mail addressed to an endpoint that never comes back. Undelivered mail is bounded first by the per-channel unacknowledged cap, which is a volume limit and therefore immune to how long a human is away. Set this longer than the longest absence you expect: a fortnight's leave is 400 h.
settings.field.comm_undelivered_ttl_sec.label = Lifetime before delivery (seconds)
settings.field.login_lockout_sec.help = How long an IP is refused after too many failed logins. Applies per realm, so locking out of one console does not lock you out of another.
settings.field.rl_enabled.help = Turns the whole abuse guard on or off — per-IP and per-token limits, auto-blocking, the lot. Off means every request reaches the application.
settings.field.rl_lockout_sec.help = How long an auto-blocked IP stays blocked. Blocking is a 403 returned before the request enters the chain, so a blocked caller costs nothing to refuse.
settings.field.rl_token_burst.help = Bucket size for one agent token — absorbs a session firing several calls in one turn without counting them against its sustained rate.
settings.field.station_locker_blob_kib.help = The largest single file a station may store. The locker is for memory and instruction files, not payloads.
settings.field.station_locker_blob_kib.label = Locker file size (KiB)
settings.field.station_locker_total_kib.help = Total locker storage one station may use. Everything here lands verbatim in your backups, and Ken cannot inspect it.
settings.field.station_locker_total_kib.label = Locker per station (KiB)
settings.field.station_max_open_tasks.help = How many tasks a station may have open at once. A list longer than this is not being worked, and refusing is more honest than letting it grow.
settings.field.station_max_open_tasks.label = Open tasks per station
settings.field.station_note_page_kib.help = The largest a single notebook page may be. A page bigger than this is a document rather than a note, and notebook pages travel in every backup.
settings.field.station_note_page_kib.label = Notebook page size (KiB)
settings.field.station_note_revision_kib.help = How much edit history one page keeps before the oldest revisions are dropped. This is an undo buffer, not an archive — it exists so a session can recover from its own bad overwrite.
settings.field.station_note_revision_kib.label = Revision history per page (KiB)
settings.field.station_notebook_kib.help = Total size of a station's current notebook pages, excluding history. Roughly sixty full pages at the default page size.
settings.field.station_notebook_kib.label = Notebook per station (KiB)
settings.field.station_task_detail_bytes.help = The optional detail and context attached to a task. A task needing more than this is really a notebook page with a plan.
settings.field.station_task_detail_bytes.label = Task detail size (bytes)
settings.field.station_task_list_limit.help = The default AND maximum number of tasks one listing returns. It bounds how much of the pile a session can pull into its context at once.
settings.field.station_task_list_limit.label = Task list page size
settings.field.station_task_text_bytes.help = A task's one-line summary and its resolution line. Short by construction: anything needing more belongs in the detail field or a notebook page.
settings.field.station_task_text_bytes.label = Task line length (bytes)

# The hearsay badge, in two strengths. Before rooms every message had one recipient,
# so "received something" meant "somebody wrote to you". A broadcast to nine stations
# marks nine actors from one send, which is why the badge says which it saw.
proposals.via_comm_broadcast = heard in a room?
proposals.via_comm_directed_hint = While this was written, another session had sent a message DIRECTLY to the identity that wrote it. That is not proof the entry came from the message — the check cannot see content — but it is the stronger of the two signals. Ask for a source before promoting.
proposals.via_comm_broadcast_hint = While this was written, the identity that wrote it was one of several recipients of a room message. Weaker than a directed message: being in a room where something was said is common, and one broadcast marks every member at once.

# --- rooms -------------------------------------------------------------------
# A room is a set of stations a HUMAN named and filled. There is no agent path to
# create one, deliberately, so this console is the only door.
rooms.heading = Rooms
rooms.lede = A room lets several stations talk at once: one message reaches every member, and each of them answers for itself. Sessions cannot create rooms — you decide who is in one. A station added today sees nothing sent before it joined.
rooms.members = members
# D1: a station with no bound endpoint is a member on paper and deaf in practice. The
# console used to admit it silently; ken-promo concluded from the resulting silence that
# rooms were receive-only, and said so to its human.
rooms.deaf = cannot receive
rooms.deaf_help = One or more members have no session bound to them, so they are in this room on paper and receive nothing sent to it.
rooms.deaf_lede = Some members cannot receive yet. Adding a station to a room is correct and permanent — but a station only hears once one of its sessions has bound an endpoint to it. Ask that session to call station_binding_voucher and then comm_bind; nothing sent meanwhile is lost, it waits for up to 30 days.
rooms.member_deaf = not bound
rooms.member_deaf_help = No session is bound to this station, so it receives nothing sent to this room. Its membership is fine and permanent; the session needs to bind. Mail already sent waits for it.
rooms.member = Station
rooms.added = Added
rooms.add = Add to room
rooms.add_help = The station joins from now on. It will not see anything the room said before today.
rooms.remove = Remove
rooms.remove_help = Takes the station out of the room. Messages already sent to it stay in its inbox — the audience was decided when each was sent.
rooms.archive = Archive
rooms.unarchive = Reopen
rooms.archive_help = Stops the room accepting new messages immediately. Its history keeps its address, and reopening restores it.
rooms.archived = archived
rooms.archived_help = This room accepts no new messages. Nothing was deleted.
rooms.create = Create room
rooms.create_help = Creates the room empty. Add stations to it afterwards.
rooms.new_name = Room name
rooms.new_name_help = The label you will pick it out by in this list. Short and specific beats descriptive.
rooms.new_purpose = What it is for
rooms.new_purpose_help = Optional. Shown to you here; it is not sent to sessions.
flash.room_created = Room {0} created. Add stations to it.
flash.room_name_required = Type a name for the room.
flash.room_create_failed = Could not create that room: {0}
flash.room_member_failed = Could not change that membership: {0}
flash.room_membership_saved = Room membership updated.
flash.room_archive_failed = Could not archive that room: {0}
flash.room_archived = Room updated.

# --- station vault -----------------------------------------------------------
# The locker's sibling. Its text says plainly what Ken does and does not protect,
# because the alternative is an operator assuming a control that is not there.
stations.vault = Vault
stations.vault_help = Credentials this station holds. Values are never listed — revealing one is a separate action and it is logged.
stations.vault_lede = Secrets a session stored here. They are kept UNENCRYPTED: anyone who can read this machine or a backup of it can read them, so the protection is the host and the backup rather than Ken. Every read below is recorded, and nothing here is destroyed — an overwrite or a delete stays recoverable.
stations.vault_name = Name
stations.vault_note = What it is
stations.vault_bytes = Size
stations.vault_reads = Reads
stations.vault_updated = Updated
stations.vault_deleted = deleted
stations.vault_deleted_help = A session retired this secret. It is no longer readable, and its value can still be brought back.
stations.vault_reveal = Reveal
stations.vault_reveal_help = Shows the value once, on the next screen. This is recorded in the trail below exactly as a session's read would be.
stations.vault_restore = Restore previous
stations.vault_restore_help = Puts back the value this name had before the last write. Use it when a session overwrote or deleted the wrong thing.
stations.vault_trail = Reads
stations.vault_trail_bounded = showing the most recent
stations.vault_trail_actor_unknown = actor not recorded
stations.vault_revealed = Secret revealed
stations.vault_revealed_help = Shown once. Reloading this page loses it, and getting it back is another recorded read.
stations.vault_revealed_logged = This reveal is now in the station's read trail, marked as coming from the console.
stations.promotions_heading = Pages a station wants promoted to knowledge
stations.promotions_lede = A session asked you to turn one of its notebook pages into a knowledge-base entry. Read it here, then save it yourself if it belongs — this page never writes knowledge.
stations.promotions_hearsay = possibly second-hand
stations.promotions_hearsay_help = This page was written while its station was receiving messages from another session, so some of it may not be first-hand. Ask for a source before promoting.
stations.promotions_moved = page has changed since
stations.promotions_moved_help = The page was edited after this request was made, so the text below is not what the session asked you to look at.
stations.promotions_slug_placeholder = entry slug, if you saved one
stations.promotions_slug_help = Optional. Recording which entry this page became leaves a trail from the note to the knowledge.
stations.promotions_converted = Mark converted
stations.promotions_converted_help = Closes the request. Save the entry yourself first — this button records your decision, it does not write knowledge.
stations.promotions_discard = Discard
stations.promotions_discard_help = Closes the request without converting. The notebook page is untouched.
stations.id = Station id
stations.id_help = The identifier sessions use to address this station: comm_directory hands it out and comm_send{to_station} spends it. Names are for you; this is what appears in a session's account of what it did.
flash.promotion_converted = Marked converted.
flash.promotion_discarded = Request discarded.
flash.promotion_already_decided = That request was already decided.
flash.promotion_failed = Could not resolve the request


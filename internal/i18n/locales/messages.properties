settings.field.station_vault_entries.help = How many credentials one station may hold. Everything here is stored UNENCRYPTED and travels in every backup — the protection is the machine and the backup, not Ken.
settings.field.station_vault_entries.label = Secrets per station
settings.field.station_vault_history_rev.help = How many superseded values stay recoverable after an overwrite or a delete. This is what makes a vault write reversible; at 0 an overwrite is final.
settings.field.station_vault_history_rev.label = Vault versions kept per secret
settings.field.station_vault_read_log.help = How many read records the audit trail retains. The per-secret read COUNT is exact regardless, so lowering this shortens the trail without hiding how often something was read.
settings.field.station_vault_read_log.label = Vault reads kept per station
settings.field.station_vault_secret_kib.help = The largest single credential a station may store. A PEM private key fits; anything larger is a file, and files belong in the locker.
settings.field.station_vault_secret_kib.label = Vault secret size (KiB)

comm.tab = Sessions
comm.eyebrow = Inter-session communication
comm.heading = Session channels
comm.lede = Connect two AI sessions so they can hand work to each other. A channel exists only because you created a pairing code — an agent cannot open one.
comm.experimental = Experimental.
comm.experimental_note = This feature is off by default and its interface may still change between releases. Message contents are never shown here: bodies are deleted once the receiving session has processed them.
comm.pair_heading = Create a pairing code
comm.pair_help = Give the same code to BOTH sessions you want to connect. The channel opens once both have used it. The code is shown once and expires shortly.
comm.pair_label = Label (optional)
comm.pair_label_help = A reminder of which two sessions this is for. Visible only to you.
comm.pair_submit = Create code
comm.pair_submit_help = Generates a single-use code for two sessions

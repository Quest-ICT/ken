comm.rotated_heading = New endpoint secret
comm.rotated_help_body = Give both values to the session that owns this endpoint. Its channels are untouched — it can carry on where it left off. Tell it to write them to a file on disk, not to rely on remembering them.
comm.rotated_warn = This is the only time the secret is shown. Only its hash is stored, and the previous secret no longer works.

stations.room_help = A room is a group this station can broadcast to — one message, delivered to every member, each acknowledging for itself. It asked for the room; you decide who is in it. Approving creates it EMPTY, and you add members on the Rooms page.
stations.room_name = Room name
stations.room_name_help = Yours to choose. Any suggestion the session made is prefilled and you can replace it entirely.
stations.room_approve = Create the room
stations.room_approve_help = Creates an empty room with this name and marks the request approved. Nobody is added until you add them.
flash.room_created_from_request = Room {0} created. It is EMPTY — add the stations that belong in it below.
flash.room_name_taken = A room called {0} already exists. Pick a different name, or use the existing room and deny the request.
stations.hearsay = via peer
stations.hearsay_help = Written while the session was reading messages from another session. Treat the content as second-hand.
stations.deferred = deferred
stations.deferred_help = How many times this has been pushed back. A high count means it keeps being avoided rather than decided.
stations.last_defer = Last deferred because
stations.archived = archived
stations.archived_help = This station is archived. Its tasks still count — nobody is staffing them.

stations.requests_heading = Requests waiting for you
stations.requests_help = A session cannot create or name a station, and cannot create a room. It asks here, and you decide — for a station, the name you type is the name it gets; for a room, you create it and choose every member. Links are not in this queue: they are made automatically by the first message, and you turn one off with Suspend in the links table below.
stations.requests_empty = No pending requests.
stations.req_purpose = Purpose
stations.req_reason = Reason
stations.req_hint = Suggested name
stations.req_hint_note = a suggestion only; what you type below is what is used
stations.req_name = Name this station
stations.req_name_help = Short and human — prod-ops, promo, public-dev. This is how you will refer to it everywhere.
stations.req_approve = Approve and name
stations.req_approve_help = Creates the station with the name you typed.
stations.req_deny = Deny
stations.req_deny_help = Refuses the request and records why.
stations.req_deny_reason = Reason for refusing
stations.req_deny_reason_help = Recorded, so the next request from this session reaches you with what you already said.
stations.prompted = prompted by a peer
stations.prompted_help = This request was filed while the session was reading messages from another session — it may be relaying someone else's idea as its own.

stations.list_heading = Stations
stations.list_empty = No stations yet. One appears here when you approve a request.
stations.self_described = Says it handles
stations.published = published
stations.published_help = Listed in the station directory other sessions can read. Not permission to reach it.
stations.publish = Publish
stations.unpublish = Unpublish
stations.rename = Rename
stations.rename_help = What this station is called, and nothing else. Nothing addresses a station by name, so renaming breaks no link, channel or message — every place the old name appeared shows the new one at once.
stations.rename_do = Save name
stations.publish_help = Lists or unlists this station in the directory. Reachability is unaffected.
stations.archive = Archive
stations.unarchive = Unarchive
stations.archive_help = Reversible. Stops COMM — no new mail is addressed here and no session may act as this station — and links go dormant. Keys keep working: the notebook, tasks, locker and vault stay reachable, and the name is held. To stop a key too, retire or revoke it.
stations.last_activity = Last active
stations.usage_notes = Notes
stations.usage_tasks = Tasks open/total
stations.usage_locker = Locker


stations.transfer = Move this station's work elsewhere
stations.transfer_help = Hand the notebook, tasks and locker to another station — when a session is gone, or a machine is being replaced.
stations.transfer_note = Moves, not copies. Refused outright if any page or file name exists on both sides, so nothing is silently overwritten — a handoff page usually collides, and you will be told which.
stations.transfer_to = Move to
stations.transfer_to_help = The station that will own these assets afterwards.
stations.transfer_notes = notebook pages (with their history)
stations.transfer_tasks = tasks
stations.transfer_locker = locker files
stations.transfer_vault = vault secrets (the transfer is logged)
stations.transfer_submit = Move
stations.transfer_submit_help = Applies every selected class at once, or nothing at all.
stations.reassign = Reassign to a conversation
stations.held = held
stations.held_help = A conversation owns this station and returns to it after a restart. If that conversation is gone, reassign the station to bring its contents back into reach.
stations.unclaimed = unclaimed
stations.unclaimed_help = No conversation owns this station yet; the next session that declares a key can adopt it.
stations.reassign_help = Hand this station to a session — the only way back into one whose conversation is gone.
stations.reassign_note = Ask the session for its conversation key (a Claude Code session has a UUID; a chat session invents one and states it in its reply), paste it here, and its next station_me call lands in this station. The key selects a post; it grants nothing, so it is not a secret. Leave the box empty to release this station back to the pool.
stations.reassign_key = Conversation key
stations.reassign_key_placeholder = paste the key the session gave you
stations.reassign_key_help = Whatever stable string that session uses to identify itself. Empty releases the station.
stations.reassign_submit = Reassign
stations.reassign_submit_help = Takes effect on the session's next call; nothing here disturbs the station contents.


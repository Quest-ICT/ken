{{define "title"}}{{.T "login.tab"}}{{end}}
{{define "content"}}
<div class="auth-card">
  <div class="auth-head">
    <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.4v1.9M12 19.7v1.9M2.4 12h1.9M19.7 12h1.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 4.6 14.3 12 12 12Z" fill="currentColor"/><path d="M9.7 12 12 4.6 12 12Z" fill="currentColor" opacity=".5"/><path d="M12 19.4 14.3 12 9.7 12Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.15" fill="currentColor"/></svg></span>
    <h1>{{.T "login.heading"}}</h1>
    <p>{{.T "login.lede"}}</p>
  </div>

  {{if .Flash}}
  <div class="flasharea" aria-live="polite">
    <div class="flash flash--danger" role="alert">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="flash__body">{{.Flash}}</div>
    </div>
  </div>
  {{end}}

  <form class="card" action="/login" method="post" novalidate>
    <input type="hidden" name="lcsrf" value="{{.Data.LCSRF}}">
    {{if .Data.Next}}<input type="hidden" name="next" value="{{.Data.Next}}">{{end}}
    <div class="field">
      <label for="user">{{.T "field.user"}}</label>
      <input class="input" id="user" name="name" type="text" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="pw">{{.T "field.password"}}</label>
      <div class="input-affix">
        <input class="input" id="pw" name="password" type="password" autocomplete="current-password" required>
        <button class="input-affix__btn" type="button" data-action="toggle-pw" data-pw-target="#pw" data-label-show="{{.T "action.show_password"}}" data-label-hide="{{.T "action.hide_password"}}" aria-pressed="false" aria-label="{{.T "action.show_password"}}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg></button>
      </div>
    </div>
    <button class="btn btn--primary btn--lg" type="submit" style="width:100%;margin-top:var(--sp-2)">{{.T "login.submit"}}</button>
  </form>

  <p class="auth-foot"><span class="mono">Ken v{{.Version}}</span> · {{.T "footer.tagline"}} · <a class="quiet-link" href="{{.SourceURL}}" rel="noopener" target="_blank">{{.T "footer.source"}}</a></p>
</div>
{{end}}
